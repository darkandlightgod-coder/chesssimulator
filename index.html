<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系統櫃 1:1 比例空間驗證與拖曳沙盤</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --scale: 4px; /* 1cm = 4px */
        }
        
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Inter', 'Microsoft JhengHei', sans-serif;
            margin: 0;
        }

        /* 標尺網格背景：每 20px (即實體 5cm) 畫一條線 */
        .shelf-bg {
            background-image: 
                linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            background-position: bottom left;
            transition: all 0.2s ease;
        }

        /* 拖曳目標區的高光效果 */
        .shelf-bg.drag-over, .staging-bg.drag-over {
            background-color: rgba(245, 158, 11, 0.15); /* Amber tint */
            box-shadow: inset 0 0 15px rgba(245, 158, 11, 0.5);
        }

        /* 玩具方塊樣式 */
        .toy-block {
            transition: transform 0.1s ease-in-out, filter 0.2s;
            cursor: grab;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5);
            flex-shrink: 0; 
        }
        
        .toy-block:hover {
            filter: brightness(1.3);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255,255,255,0.2), inset 0 0 0 1px rgba(255,255,255,0.5);
            z-index: 10;
        }

        .toy-block:active { cursor: grabbing; }
        .toy-block.dragging {
            opacity: 0.6;
            transform: scale(0.95);
            box-shadow: 0 0 15px rgba(255,255,255,0.8);
            z-index: 50;
        }

        /* 自訂互動式提示框 (Tooltip) */
        #tooltip {
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s ease, transform 0.1s ease;
            transform: translate(-50%, -10px);
        }
        #tooltip.visible {
            opacity: 1;
            transform: translate(-50%, -40px);
        }

        /* 自訂捲軸 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #777; }
    </style>
</head>
<body class="flex h-screen w-full overflow-hidden">

    <!-- =================== 左側面板 (固定區) =================== -->
    <div class="w-80 md:w-96 flex-shrink-0 bg-[#1e1814] border-r-4 border-[#3d2b1f] flex flex-col h-full z-20 shadow-[5px_0_15px_rgba(0,0,0,0.5)]">
        
        <!-- 標題與按鈕區 -->
        <div class="p-5 border-b border-[#3d2b1f] bg-[#16120f]">
            <h1 class="text-xl font-bold text-amber-500 mb-2 tracking-wide leading-snug">系統櫃立面配置<br><span class="text-white text-lg">絕對比例驗證沙盤</span></h1>
            <p class="text-gray-400 text-xs mb-4 leading-relaxed">
                <strong class="text-amber-400">1 公分 = 4 像素</strong><br>
                在右側無限畫布中排版，將游標停留在色塊上可查看尺寸，若超過限制將無法放入。
            </p>

            <div class="flex flex-col gap-3">
                <button onclick="openAddToyModal()" class="w-full py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm rounded shadow-lg transition-colors flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    新增玩具元件
                </button>
                <button onclick="openExportModal()" class="w-full py-2 bg-blue-600 hover:bg-blue-500 text-white font-bold text-sm rounded shadow-lg transition-colors flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    匯出配置存檔 (HTML)
                </button>
            </div>
        </div>

        <!-- 暫存區 (可捲動) -->
        <div class="flex-1 p-4 overflow-y-auto flex flex-col">
            <h3 class="text-amber-500/80 font-bold text-xs tracking-widest mb-3 flex items-center gap-2">
                📥 暫存庫存區 <span class="text-[10px] text-gray-500">(無尺寸限制)</span>
            </h3>
            <div id="staging-area" class="dropzone staging-bg flex-1 flex flex-wrap gap-2 content-start p-3 bg-[#110d0a] border-2 border-dashed border-[#4a3424] rounded-lg min-h-[200px]" data-name="暫存庫存區" data-max-w="9999" data-max-h="9999">
                <!-- 新增或移除的玩具會自動回到這裡 -->
            </div>
        </div>
    </div>

    <!-- =================== 右側畫布 (櫃體與層板工作區) =================== -->
    <div class="flex-1 bg-[#121212] overflow-x-auto overflow-y-auto relative p-8">
        
        <!-- 畫布容器 -->
        <div id="cabinet-canvas" class="flex gap-8 items-end min-w-max pb-20 pt-10">
            
            <!-- 初始左區櫃體 -->
            <div class="cabinet-col group flex flex-col gap-2" data-w="70">
                <div class="text-center bg-[#222] border border-[#4a3424] rounded p-2 shadow-inner relative">
                    <button onclick="deleteCabinet(this)" class="absolute top-1 right-2 text-gray-500 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity p-1" title="刪除整個櫃體">✖</button>
                    <h2 class="text-lg font-bold text-gray-200 tracking-widest cabinet-name">【 左 區 】</h2>
                    <p class="text-xs text-amber-500 font-medium mt-1">內徑寬 70cm</p>
                    <button onclick="openAddShelfModal(this)" class="mt-2 text-[10px] bg-amber-700/50 hover:bg-amber-600 text-white px-2 py-1 rounded transition-colors w-full border border-amber-600/50">+ 新增層板</button>
                </div>
                
                <div class="shelf-container flex flex-col bg-[#222] border-x-[12px] border-[#4a3424] rounded-sm shadow-2xl border-b-[16px] border-b-[#3d2b1f] justify-end">
                    <!-- 第2層 -->
                    <div class="shelf-bg dropzone relative flex items-end border-b-[8px] border-[#5e412f] group/shelf" 
                         style="width: 280px; height: 140px;" data-name="左區-層板A" data-max-w="70" data-max-h="35">
                        <span class="absolute top-1 left-2 text-[10px] text-gray-500 font-medium">高35 (示範)</span>
                        <button onclick="deleteShelf(this)" class="absolute top-1 right-1 text-gray-500 hover:text-red-500 opacity-0 group-hover/shelf:opacity-100 transition-opacity p-1 z-[60]" title="刪除此層板">✖</button>
                        <div class="toy-block draggable bg-emerald-700/80 text-white text-[10px] font-bold flex items-center justify-center" style="width: 84px; height: 30.8px;" draggable="true" data-name="龍貓" data-w="21" data-h="7.7" data-info="龍貓<br>寬: 21 cm / 高: 7.7 cm">龍貓</div>
                        <div class="toy-block draggable bg-purple-600/80 text-white text-[10px] font-bold flex items-center justify-center" style="width: 30px; height: 72px;" draggable="true" data-name="HELLFIRE EDDIE" data-w="7.5" data-h="18" data-info="HELLFIRE EDDIE<br>寬: 7.5 cm / 高: 18 cm">HE</div>
                    </div>
                    <!-- 底層 -->
                    <div class="shelf-bg dropzone relative flex items-end group/shelf" 
                         style="width: 280px; height: 260px;" data-name="左區-底層落地" data-max-w="70" data-max-h="65">
                        <span class="absolute top-1 left-2 text-[10px] text-gray-500 font-medium">落地 高65 (示範)</span>
                        <button onclick="deleteShelf(this)" class="absolute top-1 right-1 text-gray-500 hover:text-red-500 opacity-0 group-hover/shelf:opacity-100 transition-opacity p-1 z-[60]" title="刪除此層板">✖</button>
                        <div class="toy-block draggable bg-sky-700/80 text-white text-[12px] font-bold flex flex-col items-center justify-center" style="width: 132px; height: 164px;" draggable="true" data-name="超大巴斯存錢筒" data-w="33" data-h="41" data-info="超大巴斯存錢筒<br>寬: 33 cm / 高: 41 cm">
                            <span>超大巴斯</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 新增櫃體大按鈕 -->
            <div class="flex items-center h-full pb-4">
                <button onclick="openAddCabinetModal()" class="w-16 h-64 border-4 border-dashed border-gray-600 rounded-xl flex flex-col items-center justify-center text-gray-500 hover:text-amber-500 hover:border-amber-500 transition-colors group">
                    <svg class="w-8 h-8 mb-2 transform group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    <span class="text-xs font-bold writing-vertical-rl align-middle tracking-widest" style="writing-mode: vertical-rl;">新增櫃體</span>
                </button>
            </div>

        </div>
    </div>

    <!-- 懸停提示框 DOM 元件 -->
    <div id="tooltip" class="fixed z-[100] bg-gray-900 text-white border border-amber-500/50 rounded shadow-xl px-4 py-2 text-sm text-center"></div>

    <!-- 系統訊息通知 (Toast) -->
    <div id="toast-msg" class="fixed bottom-5 right-5 z-[1000] text-white px-6 py-3 rounded-lg shadow-xl opacity-0 transition-opacity duration-300 pointer-events-none hidden">成功！</div>

    <!-- 錯誤提示彈出視窗 (Modal) -->
    <div id="error-modal" class="fixed inset-0 z-[999] bg-black/70 hidden items-center justify-center backdrop-blur-sm">
        <div class="bg-gray-800 border-2 border-red-500 rounded-xl p-6 max-w-sm w-full mx-4 shadow-2xl">
            <h3 class="text-xl font-bold text-center text-white mb-2">空間驗證失敗</h3>
            <p id="error-message" class="text-gray-300 text-center mb-6 leading-relaxed"></p>
            <button onclick="closeErrorModal()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg transition-colors">我知道了</button>
        </div>
    </div>

    <!-- 新增玩具 Modal -->
    <div id="add-toy-modal" class="fixed inset-0 z-[999] bg-black/80 hidden items-center justify-center backdrop-blur-sm">
        <div class="bg-gray-800 border border-gray-600 rounded-xl p-6 max-w-sm w-full mx-4 shadow-2xl">
            <h3 class="text-xl font-bold text-amber-500 mb-4">✨ 新增玩具元件</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-gray-300 text-sm font-bold mb-1">名稱</label>
                    <input type="text" id="new-toy-name" class="w-full bg-gray-900 text-white border border-gray-600 rounded px-3 py-2" placeholder="例如: 哥吉拉">
                </div>
                <div class="flex gap-4">
                    <div class="w-1/2">
                        <label class="block text-gray-300 text-sm font-bold mb-1">面寬 (cm)</label>
                        <input type="number" id="new-toy-w" class="w-full bg-gray-900 text-white border border-gray-600 rounded px-3 py-2" placeholder="10">
                    </div>
                    <div class="w-1/2">
                        <label class="block text-gray-300 text-sm font-bold mb-1">高度 (cm)</label>
                        <input type="number" id="new-toy-h" class="w-full bg-gray-900 text-white border border-gray-600 rounded px-3 py-2" placeholder="20">
                    </div>
                </div>
                <div>
                    <label class="block text-gray-300 text-sm font-bold mb-1">代表顏色</label>
                    <input type="color" id="new-toy-color" class="w-full h-10 bg-gray-900 border border-gray-600 rounded cursor-pointer" value="#b91c1c">
                </div>
            </div>
            <div class="mt-6 flex justify-end gap-3">
                <button onclick="closeAddToyModal()" class="px-4 py-2 bg-gray-700 text-white rounded">取消</button>
                <button onclick="createNewToy()" class="px-4 py-2 bg-amber-600 text-white font-bold rounded">加入暫存區</button>
            </div>
        </div>
    </div>

    <!-- 新增櫃體 Modal -->
    <div id="add-cabinet-modal" class="fixed inset-0 z-[999] bg-black/80 hidden items-center justify-center backdrop-blur-sm">
        <div class="bg-gray-800 border border-gray-600 rounded-xl p-6 max-w-sm w-full mx-4 shadow-2xl">
            <h3 class="text-xl font-bold text-amber-500 mb-4">🗄️ 新增整座櫃體</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-gray-300 text-sm font-bold mb-1">櫃體名稱 (例如: 右區)</label>
                    <input type="text" id="new-cab-name" class="w-full bg-gray-900 text-white border border-gray-600 rounded px-3 py-2">
                </div>
                <div>
                    <label class="block text-gray-300 text-sm font-bold mb-1">內徑總寬度 (cm)</label>
                    <input type="number" id="new-cab-w" class="w-full bg-gray-900 text-white border border-gray-600 rounded px-3 py-2" value="70">
                </div>
            </div>
            <div class="mt-6 flex justify-end gap-3">
                <button onclick="closeModal('add-cabinet-modal')" class="px-4 py-2 bg-gray-700 text-white rounded">取消</button>
                <button onclick="createNewCabinet()" class="px-4 py-2 bg-amber-600 text-white font-bold rounded">建立櫃體</button>
            </div>
        </div>
    </div>

    <!-- 新增層板 Modal -->
    <div id="add-shelf-modal" class="fixed inset-0 z-[999] bg-black/80 hidden items-center justify-center backdrop-blur-sm">
        <div class="bg-gray-800 border border-gray-600 rounded-xl p-6 max-w-sm w-full mx-4 shadow-2xl">
            <h3 class="text-xl font-bold text-amber-500 mb-4">➖ 新增內部層板</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-gray-300 text-sm font-bold mb-1">層板標籤 (例如: 第3層)</label>
                    <input type="text" id="new-shelf-name" class="w-full bg-gray-900 text-white border border-gray-600 rounded px-3 py-2">
                </div>
                <div>
                    <label class="block text-gray-300 text-sm font-bold mb-1">該層淨高限制 (cm)</label>
                    <input type="number" id="new-shelf-h" class="w-full bg-gray-900 text-white border border-gray-600 rounded px-3 py-2" value="35">
                </div>
            </div>
            <div class="mt-6 flex justify-end gap-3">
                <button onclick="closeModal('add-shelf-modal')" class="px-4 py-2 bg-gray-700 text-white rounded">取消</button>
                <button onclick="createNewShelf()" class="px-4 py-2 bg-amber-600 text-white font-bold rounded">安插層板</button>
            </div>
        </div>
    </div>

    <!-- 匯出存檔 Modal -->
    <div id="export-modal" class="fixed inset-0 z-[999] bg-black/80 hidden items-center justify-center backdrop-blur-sm">
        <div class="bg-gray-800 border border-gray-600 rounded-xl p-6 max-w-2xl w-full mx-4 shadow-2xl flex flex-col max-h-[90vh]">
            <h3 class="text-xl font-bold text-amber-500 mb-4">💾 匯出配置與存檔</h3>
            <p class="text-gray-400 text-sm mb-4">由於本應用程式改為完全離線運作以保障您的隱私，請選擇以下方式保存您的配置：</p>
            
            <div class="flex gap-4 mb-6">
                <button onclick="exportAsFile()" class="flex-1 py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg transition-colors text-center">
                    📥 下載完整 HTML 檔案<br><span class="text-xs font-normal opacity-80">下次直接點開檔案即可繼續編輯</span>
                </button>
                <button onclick="showSourceCode()" class="flex-1 py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg transition-colors text-center">
                    📋 顯示 HTML 原始碼<br><span class="text-xs font-normal opacity-80">複製文字以便備份或分享</span>
                </button>
            </div>

            <!-- 原始碼顯示區塊 (預設隱藏) -->
            <div id="code-preview-area" class="hidden flex-col flex-1 min-h-0">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-sm font-bold text-gray-300">請全選並複製以下文字：</span>
                    <button onclick="copyCodeText()" class="text-xs bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded text-white">點我一鍵複製</button>
                </div>
                <textarea id="export-textarea" class="w-full flex-1 bg-gray-900 text-gray-300 border border-gray-600 rounded p-3 font-mono text-xs resize-none focus:outline-none" readonly></textarea>
            </div>

            <div class="mt-6 flex justify-end shrink-0">
                <button onclick="closeModal('export-modal')" class="px-6 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded transition-colors">關閉視窗</button>
            </div>
        </div>
    </div>

    <script>
        const tooltip = document.getElementById('tooltip');
        window.draggedItem = null;
        let targetShelfContainer = null; // 用於記錄要在哪個櫃體新增層板

        // 初始化所有事件 (包含讀取匯出檔時的重新綁定)
        window.onload = function() {
            document.querySelectorAll('.toy-block').forEach(window.attachToyEvents);
            document.querySelectorAll('.dropzone').forEach(window.attachDropzoneEvents);
        };

        // ================== 核心交互：拖曳與工具提示 ==================
        window.attachToyEvents = function(block) {
            // 避免重複綁定
            block.replaceWith(block.cloneNode(true));
            const newBlock = document.querySelector(`.toy-block[data-name="${block.getAttribute('data-name')}"]`) || block; // fallback
            
            // 需要重新抓取因為被替換過了，這裡寫法改良為直接對傳入元件的純淨拷貝做處理
        };
        
        // 為了確保安全重新綁定，寫一個全域更新器
        window.rebindAllEvents = function() {
            const toys = document.querySelectorAll('.toy-block');
            toys.forEach(block => {
                block.onmouseenter = (e) => {
                    if(block.classList.contains('dragging')) return;
                    tooltip.innerHTML = block.getAttribute('data-info');
                    tooltip.classList.add('visible');
                    tooltip.style.left = e.clientX + 'px';
                    tooltip.style.top = e.clientY + 'px';
                };
                block.onmousemove = (e) => {
                    tooltip.style.left = e.clientX + 'px';
                    tooltip.style.top = e.clientY + 'px';
                };
                block.onmouseleave = () => tooltip.classList.remove('visible');
                
                block.ondragstart = (e) => {
                    window.draggedItem = block;
                    tooltip.classList.remove('visible');
                    setTimeout(() => block.classList.add('dragging'), 0);
                };
                block.ondragend = () => {
                    block.classList.remove('dragging');
                    window.draggedItem = null;
                    document.querySelectorAll('.dropzone').forEach(dz => dz.classList.remove('drag-over'));
                };
            });

            const dropzones = document.querySelectorAll('.dropzone');
            dropzones.forEach(dropzone => {
                dropzone.ondragover = (e) => {
                    e.preventDefault(); 
                    dropzone.classList.add('drag-over');
                };
                dropzone.ondragleave = () => {
                    dropzone.classList.remove('drag-over');
                };
                dropzone.ondrop = (e) => {
                    e.preventDefault();
                    dropzone.classList.remove('drag-over');
                    
                    if (!window.draggedItem) return;
                    if (dropzone === window.draggedItem.parentElement) return; 

                    const maxW = parseFloat(dropzone.getAttribute('data-max-w')) || 9999;
                    const maxH = parseFloat(dropzone.getAttribute('data-max-h')) || 9999;
                    const zoneName = dropzone.getAttribute('data-name') || '此區塊';
                    
                    const itemW = parseFloat(window.draggedItem.getAttribute('data-w'));
                    const itemH = parseFloat(window.draggedItem.getAttribute('data-h'));
                    const itemName = window.draggedItem.getAttribute('data-name');

                    if (itemH > maxH) {
                        showErrorModal(`【高度不足】<br>「${itemName}」高度為 <b>${itemH}</b> cm<br>「${zoneName}」淨高限制為 <b>${maxH}</b> cm<br><br>無法放入！高度超出了 <span class="text-red-400 font-bold text-xl">${(itemH - maxH).toFixed(1)}</span> cm`);
                        return;
                    }

                    const currentItems = Array.from(dropzone.querySelectorAll('.toy-block'));
                    const currentUsedW = currentItems.reduce((sum, item) => sum + parseFloat(item.getAttribute('data-w')), 0);
                    const remainingW = maxW - currentUsedW;

                    if (itemW > remainingW) {
                        showErrorModal(`【寬度不足】<br>「${itemName}」需面寬 <b>${itemW}</b> cm<br>「${zoneName}」剩餘寬度 <b>${remainingW.toFixed(1)}</b> cm<br><br>無法塞入！寬度還差 <span class="text-red-400 font-bold text-xl">${(itemW - remainingW).toFixed(1)}</span> cm`);
                        return;
                    }
                    dropzone.appendChild(window.draggedItem);
                };
            });
        }
        
        // 初次呼叫綁定
        window.rebindAllEvents();

        // ================== Modal 控制與共用工具 ==================
        window.closeModal = function(id) {
            document.getElementById(id).classList.add('hidden');
            document.getElementById(id).classList.remove('flex');
        };

        window.showToast = function(msg, isError = false) {
            const toast = document.getElementById('toast-msg');
            toast.textContent = msg;
            toast.className = `fixed bottom-5 right-5 z-[1000] text-white px-6 py-3 rounded-lg shadow-xl transition-opacity duration-300 ${isError ? 'bg-red-600' : 'bg-emerald-600'}`;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.remove('opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0');
                setTimeout(() => toast.classList.add('hidden'), 300);
            }, 3000);
        };

        window.showErrorModal = function(msg) {
            document.getElementById('error-message').innerHTML = msg;
            document.getElementById('error-modal').classList.remove('hidden');
            document.getElementById('error-modal').classList.add('flex');
        };
        window.closeErrorModal = () => closeModal('error-modal');

        // ================== 新增與刪除物件邏輯 ==================
        
        // 玩具元件
        window.openAddToyModal = () => {
            document.getElementById('add-toy-modal').classList.remove('hidden');
            document.getElementById('add-toy-modal').classList.add('flex');
        };
        window.closeAddToyModal = () => {
            closeModal('add-toy-modal');
            document.getElementById('new-toy-name').value = '';
        };
        window.createNewToy = function() {
            const name = document.getElementById('new-toy-name').value.trim();
            const w = parseFloat(document.getElementById('new-toy-w').value);
            const h = parseFloat(document.getElementById('new-toy-h').value);
            const color = document.getElementById('new-toy-color').value;

            if (!name || isNaN(w) || isNaN(h) || w <= 0 || h <= 0) {
                showErrorModal("請填寫完整的玩具名稱與長高數值（須大於0）！"); return;
            }

            const newToy = document.createElement('div');
            newToy.className = `toy-block draggable text-white text-[11px] font-bold flex flex-col items-center justify-center leading-tight text-center`;
            newToy.style.backgroundColor = color;
            newToy.style.width = (w * 4) + 'px';
            newToy.style.height = (h * 4) + 'px';
            newToy.setAttribute('draggable', 'true');
            newToy.setAttribute('data-name', name);
            newToy.setAttribute('data-w', w);
            newToy.setAttribute('data-h', h);
            newToy.setAttribute('data-info', `${name}<br>寬: ${w} cm / 高: ${h} cm`);
            newToy.innerHTML = name.length > 5 ? name.substring(0, 4) + '..' : name;

            document.getElementById('staging-area').appendChild(newToy);
            window.rebindAllEvents();
            closeAddToyModal();
            showToast('已成功新增玩具至暫存區！');
        };

        // 櫃體
        window.openAddCabinetModal = () => {
            document.getElementById('add-cabinet-modal').classList.remove('hidden');
            document.getElementById('add-cabinet-modal').classList.add('flex');
        };
        window.createNewCabinet = function() {
            const name = document.getElementById('new-cab-name').value.trim() || '自訂櫃';
            const w = parseFloat(document.getElementById('new-cab-w').value);
            if(isNaN(w) || w < 10) return showErrorModal("櫃體寬度必須大於 10 公分！");

            const col = document.createElement('div');
            col.className = 'cabinet-col group flex flex-col gap-2';
            col.setAttribute('data-w', w);
            col.innerHTML = `
                <div class="text-center bg-[#222] border border-[#4a3424] rounded p-2 shadow-inner relative">
                    <button onclick="deleteCabinet(this)" class="absolute top-1 right-2 text-gray-500 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity p-1" title="刪除整個櫃體">✖</button>
                    <h2 class="text-lg font-bold text-gray-200 tracking-widest cabinet-name">${name}</h2>
                    <p class="text-xs text-amber-500 font-medium mt-1">內徑寬 ${w}cm</p>
                    <button onclick="openAddShelfModal(this)" class="mt-2 text-[10px] bg-amber-700/50 hover:bg-amber-600 text-white px-2 py-1 rounded transition-colors w-full border border-amber-600/50">+ 新增層板</button>
                </div>
                <div class="shelf-container flex flex-col bg-[#222] border-x-[12px] border-[#4a3424] rounded-sm shadow-2xl border-b-[16px] border-b-[#3d2b1f] justify-end min-h-[100px]">
                </div>
            `;
            
            const btnContainer = document.querySelector('#cabinet-canvas > div:last-child');
            document.getElementById('cabinet-canvas').insertBefore(col, btnContainer);
            closeModal('add-cabinet-modal');
            showToast('櫃體新增成功！請開始加入層板。');
        };
        window.deleteCabinet = function(btn) {
            const col = btn.closest('.cabinet-col');
            rescueToysToStaging(col);
            col.remove();
            showToast('櫃體已移除，內部物件已安全移至暫存區。');
        };

        // 層板
        window.openAddShelfModal = (btn) => {
            targetShelfContainer = btn.closest('.cabinet-col').querySelector('.shelf-container');
            document.getElementById('add-shelf-modal').classList.remove('hidden');
            document.getElementById('add-shelf-modal').classList.add('flex');
        };
        window.createNewShelf = function() {
            if(!targetShelfContainer) return;
            const name = document.getElementById('new-shelf-name').value.trim() || '自訂層';
            const h = parseFloat(document.getElementById('new-shelf-h').value);
            const parentW = parseFloat(targetShelfContainer.closest('.cabinet-col').getAttribute('data-w'));
            const cabName = targetShelfContainer.closest('.cabinet-col').querySelector('.cabinet-name').innerText;

            if(isNaN(h) || h < 5) return showErrorModal("層板淨高必須大於 5 公分！");

            const shelf = document.createElement('div');
            shelf.className = 'shelf-bg dropzone relative flex items-end border-b-[8px] border-[#5e412f] group/shelf';
            shelf.style.width = (parentW * 4) + 'px';
            shelf.style.height = (h * 4) + 'px';
            shelf.setAttribute('data-name', `${cabName}-${name}`);
            shelf.setAttribute('data-max-w', parentW);
            shelf.setAttribute('data-max-h', h);
            
            shelf.innerHTML = `
                <span class="absolute top-1 left-2 text-[10px] text-gray-500 font-medium">${name} (高${h})</span>
                <button onclick="deleteShelf(this)" class="absolute top-1 right-1 text-gray-500 hover:text-red-500 opacity-0 group-hover/shelf:opacity-100 transition-opacity p-1 z-[60]" title="刪除此層板">✖</button>
            `;
            
            // 插入在最上方(視覺上的最頂層)
            targetShelfContainer.insertBefore(shelf, targetShelfContainer.firstChild);
            window.rebindAllEvents();
            closeModal('add-shelf-modal');
            showToast('層板新增成功！');
        };
        window.deleteShelf = function(btn) {
            const shelf = btn.closest('.dropzone');
            rescueToysToStaging(shelf);
            shelf.remove();
            showToast('層板已移除，內部物件已安全移至暫存區。');
        };

        // 救援物件函式 (安全轉移)
        function rescueToysToStaging(container) {
            const staging = document.getElementById('staging-area');
            container.querySelectorAll('.toy-block').forEach(toy => {
                staging.appendChild(toy);
            });
        }

        // ================== 匯出存檔邏輯 (純前端方案) ==================
        window.openExportModal = () => {
            document.getElementById('code-preview-area').classList.add('hidden');
            document.getElementById('export-modal').classList.remove('hidden');
            document.getElementById('export-modal').classList.add('flex');
        };

        function getCleanHTMLContent() {
            // 複製當前網頁 DOM 樹
            const clonedDoc = document.documentElement.cloneNode(true);
            
            // 移除不需要保留在存檔裡的狀態 (如隱藏所有開啟的 modal)
            clonedDoc.querySelectorAll('.fixed').forEach(el => {
                if (el.id !== 'tooltip' && el.id !== 'toast-msg') {
                    el.classList.add('hidden');
                    el.classList.remove('flex');
                }
            });
            // 移除 dragging 狀態
            clonedDoc.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging'));
            clonedDoc.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
            
            // 清空 textarea 避免無窮迴圈自我複製增長
            const textarea = clonedDoc.querySelector('#export-textarea');
            if(textarea) textarea.textContent = '';
            
            return '<!DOCTYPE html>\n<html lang="zh-TW">\n' + clonedDoc.innerHTML + '\n</html>';
        }

        window.exportAsFile = function() {
            const htmlContent = getCleanHTMLContent();
            const blob = new Blob([htmlContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'MyCabinetPlanner.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('已成功下載存檔！下次直接點開檔案即可。');
        };

        window.showSourceCode = function() {
            const htmlContent = getCleanHTMLContent();
            const area = document.getElementById('code-preview-area');
            const textarea = document.getElementById('export-textarea');
            area.classList.remove('hidden');
            area.classList.add('flex');
            textarea.value = htmlContent;
        };

        window.copyCodeText = function() {
            const textarea = document.getElementById('export-textarea');
            textarea.select();
            document.execCommand('copy');
            showToast('原始碼已複製到剪貼簿！');
        };
    </script>
</body>
</html>
