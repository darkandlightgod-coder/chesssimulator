<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D 室內裝潢與系統櫃旗艦規劃系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/DragControls.js"></script>
    <style>
        :root { --scale: 2px; }
        body { margin: 0; overflow: hidden; background-color: #121212; color: #e0e0e0; font-family: 'Inter', sans-serif; touch-action: none; user-select: none; }
        
        /* 雙螢幕佈局 */
        #app-container { display: flex; flex-direction: column; height: 100dvh; width: 100vw; position: relative; }
        #view-3d { flex: 1.2; min-height: 45vh; background: #000; position: relative; z-index: 1; }
        #view-2d { flex: 0.8; min-height: 35vh; background-color: #1a1a1a; background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 20px 20px; background-position: center center; position: relative; overflow: hidden; border-top: 4px solid #3d2b1f; touch-action: none; }
        
        /* 頂部控制列 (歷史與回正) */
        #top-bar { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; gap: 8px; background: rgba(0,0,0,0.6); padding: 6px 12px; border-radius: 20px; border: 1px solid #444; backdrop-filter: blur(5px); }
        .top-btn { background: #374151; color: white; border: none; padding: 5px 12px; border-radius: 15px; font-size: 12px; cursor: pointer; transition: 0.2s; font-weight: bold; }
        .top-btn:hover { background: #d97706; }
        .top-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* 側邊欄 */
        #sidebar { position: absolute; left: 0; top: 0; height: 100%; width: 280px; background: rgba(30, 24, 20, 0.95); backdrop-filter: blur(10px); z-index: 90; transition: transform 0.3s ease; display: flex; flex-direction: column; border-right: 2px solid #4a3424; box-shadow: 5px 0 15px rgba(0,0,0,0.5); }
        #sidebar.minimized { transform: translateX(-100%); }
        #sidebar-toggle { position: absolute; right: -40px; top: 60px; width: 40px; height: 40px; background: #d97706; color: white; border-radius: 0 8px 8px 0; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; box-shadow: 2px 0 5px rgba(0,0,0,0.3); z-index: 91; }
        
        /* 2D 平面圖物件 */
        #floor-plan-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 0; height: 0; }
        .map-item { position: absolute; transform: translate(-50%, -50%); box-sizing: border-box; cursor: grab; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; color: white; text-shadow: 1px 1px 2px black; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border-radius: 2px; transition: filter 0.2s; border: 1px solid rgba(255,255,255,0.2); }
        .map-item:hover { filter: brightness(1.3); outline: 2px solid #d97706; z-index: 20 !important; }
        .map-item:active { cursor: grabbing; }
        
        /* 攝影機圖示 */
        #camera-marker { position: absolute; width: 30px; height: 30px; transform: translate(-50%, -50%); cursor: grab; z-index: 100; display: block; }
        #camera-marker .dot { width: 12px; height: 12px; background: #ef4444; border-radius: 50%; margin: auto; position: absolute; top: 9px; left: 9px; box-shadow: 0 0 10px #ef4444; }
        #camera-marker .cone { width: 0; height: 0; border-left: 20px solid transparent; border-right: 20px solid transparent; border-bottom: 40px solid rgba(239, 68, 68, 0.4); position: absolute; top: -30px; left: -5px; pointer-events: none; }

        .modal { z-index: 10000; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }

        /* 行動版優化 */
        @media (max-width: 768px) {
            #sidebar { width: 100%; height: 40%; top: 0; border-right: none; border-bottom: 2px solid #4a3424; }
            #sidebar.minimized { transform: translateY(-100%); }
            #sidebar-toggle { right: 10px; top: -40px; border-radius: 8px 8px 0 0; width: 60px; }
            #view-3d { flex: 1; }
            #view-2d { flex: 1; }
        }
    </style>
</head>
<body>
    <div id="app-container">
        <!-- 頂部工具列 (回正/Undo/Redo) -->
        <div id="top-bar">
            <button class="top-btn" onclick="undo()" id="btn-undo">↩ 上一步</button>
            <button class="top-btn" onclick="redo()" id="btn-redo">下一步 ↪</button>
            <button class="top-btn" onclick="resetViews()">🔄 視角回正</button>
        </div>

        <!-- 3D 視圖區 -->
        <div id="view-3d">
            <div class="absolute top-14 right-4 bg-black/60 px-3 py-1.5 rounded-lg text-[10px] text-gray-300 pointer-events-none z-10 border border-gray-600" id="hint-3d">
                👆 3D: 左鍵旋轉 | 右鍵平移 | 滾輪縮放 | 拖曳物件 | 雙擊編輯
            </div>
        </div>

        <!-- 2D 平面圖區 -->
        <div id="view-2d">
            <div class="absolute top-4 right-4 bg-black/60 px-3 py-1.5 rounded-lg text-[10px] text-gray-300 pointer-events-none z-10 border border-gray-600" id="hint-2d">
                👇 2D (裝潢俯視): 拖曳紅點看3D視角 | 拖曳物件 | 空白處平移
            </div>
            <div id="floor-plan-container">
                <div id="camera-marker"><div class="cone"></div><div class="dot"></div></div>
            </div>
        </div>

        <!-- 側邊欄 (雙維度動態切換) -->
        <div id="sidebar">
            <div id="sidebar-toggle" onclick="toggleSidebar()">☰</div>
            
            <!-- 模式切換標題 -->
            <div class="p-3 border-b border-[#3d2b1f] bg-[#16120f] flex justify-between items-center" id="mode-header">
                <h1 class="text-sm font-bold text-emerald-400" id="mode-title">🏠 裝潢規劃模式</h1>
            </div>

            <!-- 內容區 -->
            <div class="flex-1 overflow-y-auto p-4 space-y-4" id="sidebar-content">
                
                <!-- 【Room 模式專用區塊】 -->
                <div id="room-tools">
                    <button onclick="enterCabinetMode()" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-3 rounded mb-4 shadow-lg border border-amber-400 animate-pulse">
                        🛠️ 進入系統櫃編輯模式 (立面圖)
                    </button>
                    
                    <h3 class="text-xs font-bold text-gray-400 mb-2 border-b border-gray-700 pb-1">🧱 空間與牆面</h3>
                    <div class="grid grid-cols-2 gap-2 mb-4">
                        <button onclick="addObj('wall')" class="bg-gray-800 hover:bg-gray-700 text-xs py-2 rounded border border-gray-600">新增牆面</button>
                        <button onclick="addObj('floor')" class="bg-gray-800 hover:bg-gray-700 text-xs py-2 rounded border border-gray-600">新增木地板</button>
                    </div>

                    <h3 class="text-xs font-bold text-gray-400 mb-2 border-b border-gray-700 pb-1">🪑 裝潢家具</h3>
                    <div class="grid grid-cols-2 gap-2 mb-4">
                        <button onclick="addObj('cabinet')" class="bg-amber-900/50 text-amber-400 text-xs py-2 rounded border border-amber-700 col-span-2">+ 新增一座系統櫃</button>
                        <button onclick="addObj('wardrobe')" class="bg-gray-800 text-xs py-2 rounded border border-gray-600">大衣櫃</button>
                        <button onclick="addObj('sofa')" class="bg-gray-800 text-xs py-2 rounded border border-gray-600">沙發</button>
                        <button onclick="addObj('bed')" class="bg-gray-800 text-xs py-2 rounded border border-gray-600">雙人床</button>
                        <button onclick="addObj('tv')" class="bg-gray-800 text-xs py-2 rounded border border-gray-600">電視牆</button>
                        <button onclick="addObj('bathtub')" class="bg-gray-800 text-xs py-2 rounded border border-gray-600">浴缸</button>
                        <button onclick="addObj('plant')" class="bg-green-900/40 text-green-400 text-xs py-2 border border-green-800 rounded">盆栽</button>
                    </div>
                </div>

                <!-- 【Cabinet 模式專用區塊】 -->
                <div id="cabinet-tools" class="hidden">
                    <button onclick="exitCabinetMode()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded mb-4 shadow-lg border border-emerald-400">
                        💾 保存並返回裝潢模式
                    </button>

                    <h3 class="text-xs font-bold text-gray-400 mb-2 border-b border-gray-700 pb-1">🧸 玩具與公仔管理</h3>
                    <button onclick="addObj('toy')" class="w-full bg-blue-600 hover:bg-blue-500 text-white text-xs py-2 rounded font-bold mb-2 shadow">+ 新增單一公仔</button>
                    <button onclick="restoreClassicSetup()" class="w-full bg-purple-600 hover:bg-purple-500 text-white text-xs py-2 rounded font-bold mb-4 shadow">✨ 一鍵載入 54 件經典陣容</button>
                </div>

                <!-- 共用工具區 -->
                <div>
                    <h3 class="text-xs font-bold text-gray-400 mb-2 border-b border-gray-700 pb-1">⚙️ 系統工具</h3>
                    <button onclick="exportHTML()" class="w-full py-2 bg-gray-700 hover:bg-gray-600 text-white font-bold rounded text-xs border border-gray-500">💾 匯出 HTML 存檔下載</button>
                </div>

            </div>
        </div>
    </div>

    <!-- 統一編輯面板 (Modal) -->
    <div id="edit-modal" class="fixed inset-0 modal bg-black/80 hidden items-center justify-center backdrop-blur-sm px-4">
        <div class="bg-gray-800 border border-amber-600 rounded-xl p-5 max-w-sm w-full shadow-2xl max-h-[90vh] overflow-y-auto">
            <h3 class="text-lg font-bold text-white mb-1" id="edit-title">編輯物件</h3>
            <p class="text-[10px] text-gray-400 mb-4">單位：公分 (cm) | 系統會自動對齊底部重力</p>
            <input type="hidden" id="edit-id">
            
            <div class="space-y-3 mb-5">
                <div><label class="block text-gray-400 text-[10px] mb-1">名稱</label><input type="text" id="edit-name" class="w-full bg-gray-900 text-white border border-gray-600 rounded px-2 py-1.5 text-sm"></div>
                <div class="grid grid-cols-3 gap-2">
                    <div><label class="block text-gray-400 text-[10px] mb-1">面寬(W)</label><input type="number" id="edit-w" class="w-full bg-gray-900 text-white border border-gray-600 rounded px-2 py-1.5 text-sm"></div>
                    <div><label class="block text-gray-400 text-[10px] mb-1">高度(H)</label><input type="number" id="edit-h" class="w-full bg-gray-900 text-white border border-gray-600 rounded px-2 py-1.5 text-sm"></div>
                    <div><label class="block text-gray-400 text-[10px] mb-1">深度(D)</label><input type="number" id="edit-d" class="w-full bg-gray-900 text-white border border-gray-600 rounded px-2 py-1.5 text-sm"></div>
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <div><label class="block text-gray-400 text-[10px] mb-1">X座標</label><input type="number" id="edit-x" class="w-full bg-gray-900 text-white border border-gray-600 rounded px-2 py-1.5 text-sm"></div>
                    <div><label class="block text-gray-400 text-[10px] mb-1">Y(離地)</label><input type="number" id="edit-y" class="w-full bg-gray-900 text-white border border-gray-600 rounded px-2 py-1.5 text-sm"></div>
                    <div><label class="block text-gray-400 text-[10px] mb-1">Z座標</label><input type="number" id="edit-z" class="w-full bg-gray-900 text-white border border-gray-600 rounded px-2 py-1.5 text-sm"></div>
                </div>
                <div><label class="block text-gray-400 text-[10px] mb-1">水平旋轉 (度)</label><input type="number" id="edit-rot" class="w-full bg-gray-900 text-white border border-gray-600 rounded px-2 py-1.5 text-sm"></div>
                
                <!-- 專屬櫃體層板管理器 -->
                <div id="cabinet-shelves-manager" class="hidden mt-4 p-3 bg-gray-900 border border-gray-700 rounded">
                    <label class="block text-amber-500 text-xs font-bold mb-2">層板間距微調 (由下而上)</label>
                    <div id="shelves-list" class="space-y-2 max-h-40 overflow-y-auto"></div>
                    <button onclick="addShelfToCabinet()" class="mt-2 w-full text-[10px] bg-gray-700 hover:bg-gray-600 py-1.5 rounded border border-gray-500">+ 往上新增一層</button>
                </div>
            </div>
            
            <div class="flex flex-col space-y-2">
                <button onclick="saveObjectEdit()" class="w-full py-2 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded text-sm shadow">💾 儲存設定</button>
                <button onclick="document.getElementById('image-uploader').click()" class="w-full py-2 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded text-sm">🖼️ 上傳真實材質/圖片</button>
                <button onclick="deleteObject()" class="w-full py-2 border border-red-600 text-red-400 hover:bg-red-600 hover:text-white font-bold rounded text-sm">✖ 刪除物件</button>
                <button onclick="closeModal('edit-modal')" class="w-full py-2 bg-gray-700 hover:bg-gray-600 text-white font-bold rounded text-sm">取消</button>
            </div>
        </div>
    </div>
    <input type="file" id="image-uploader" accept="image/*" class="hidden">

    <script id="saved-state" type="application/json">[]</script>

    <script>
        // --- 核心狀態與歷史紀錄 ---
        const SCALE_2D = 2; // 2D圖 1cm = 2px
        let appMode = 'ROOM'; // 'ROOM' (裝潢) or 'CABINET' (立面)
        let objectsData = [];
        let historyStack = [];
        let redoStack = [];
        
        let scene, camera, renderer, orbitControls, dragControls;
        let draggableMeshes = [];
        let activeEditId = null;
        const textureLoader = new THREE.TextureLoader();

        // 輔助函式
        const openModal = (id) => { document.getElementById(id).classList.remove('hidden'); document.getElementById(id).classList.add('flex'); };
        const closeModal = (id) => { document.getElementById(id).classList.add('hidden'); document.getElementById(id).classList.remove('flex'); };
        const toggleSidebar = () => document.getElementById('sidebar').classList.toggle('minimized');
        const generateId = () => 'obj_' + Math.random().toString(36).substr(2, 9);

        // --- 歷史紀錄系統 ---
        function pushHistory() {
            historyStack.push(JSON.parse(JSON.stringify(objectsData)));
            redoStack = [];
            if(historyStack.length > 25) historyStack.shift();
            updateHistoryBtns();
        }
        function undo() {
            if(historyStack.length > 1) {
                redoStack.push(historyStack.pop());
                objectsData = JSON.parse(JSON.stringify(historyStack[historyStack.length - 1]));
                rebuildEntireScene(); updateHistoryBtns();
            }
        }
        function redo() {
            if(redoStack.length > 0) {
                const state = redoStack.pop();
                historyStack.push(JSON.parse(JSON.stringify(state)));
                objectsData = JSON.parse(JSON.stringify(state));
                rebuildEntireScene(); updateHistoryBtns();
            }
        }
        function updateHistoryBtns() {
            document.getElementById('btn-undo').disabled = historyStack.length <= 1;
            document.getElementById('btn-redo').disabled = redoStack.length === 0;
        }

        // --- 視角回正系統 ---
        function resetViews() {
            if(appMode === 'ROOM') {
                camera.position.set(0, 400, 500); orbitControls.target.set(0, 0, 0);
            } else {
                camera.position.set(0, 150, 400); orbitControls.target.set(0, 100, 0);
            }
            orbitControls.update();
            panX = 0; panY = 0;
            document.getElementById('floor-plan-container').style.transform = `translate(-50%, -50%)`;
        }

        // --- 模式切換系統 (雙維度) ---
        function enterCabinetMode() {
            appMode = 'CABINET';
            document.getElementById('room-tools').classList.add('hidden');
            document.getElementById('cabinet-tools').classList.remove('hidden');
            document.getElementById('mode-title').innerHTML = '🛠️ 系統櫃編輯模式';
            document.getElementById('mode-title').classList.replace('text-emerald-400', 'text-amber-400');
            document.getElementById('camera-marker').style.display = 'none'; // 立面圖隱藏攝影機標籤
            document.getElementById('hint-2d').innerHTML = '👇 2D (櫃體立面): 呈現高度與寬度 | 拖曳排列公仔';
            
            rebuildEntireScene();
            resetViews();
        }

        function exitCabinetMode() {
            appMode = 'ROOM';
            document.getElementById('cabinet-tools').classList.add('hidden');
            document.getElementById('room-tools').classList.remove('hidden');
            document.getElementById('mode-title').innerHTML = '🏠 裝潢規劃模式';
            document.getElementById('mode-title').classList.replace('text-amber-400', 'text-emerald-400');
            document.getElementById('camera-marker').style.display = 'block';
            document.getElementById('hint-2d').innerHTML = '👇 2D (裝潢俯視): 拖曳紅點看3D視角 | 拖曳物件';
            
            rebuildEntireScene();
            resetViews();
        }

        // --- 1. 初始化 Three.js ---
        function init3D() {
            const container = document.getElementById('view-3d');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);
            
            camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 5000);
            renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);
            
            orbitControls = new THREE.OrbitControls(camera, renderer.domElement);
            orbitControls.enableDamping = true; orbitControls.dampingFactor = 0.05;

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(300, 500, 200);
            dirLight.castShadow = true;
            scene.add(dirLight);
            
            const grid = new THREE.GridHelper(2000, 100, 0x444444, 0x222222); grid.position.y = -0.1; scene.add(grid);

            // Drag Controls
            dragControls = new THREE.DragControls(draggableMeshes, camera, renderer.domElement);
            dragControls.addEventListener('dragstart', () => orbitControls.enabled = false);
            dragControls.addEventListener('drag', (e) => {
                const obj = objectsData.find(o => o.id === e.object.userData.id);
                if(obj) {
                    // 重力貼齊: Y 永遠在底部
                    if(appMode === 'CABINET' && obj.type === 'toy') {
                        // 在立面模式拖曳玩具，允許 X, Y 變動 (假裝在牆上移)
                    } else {
                        e.object.position.y = obj.y + (obj.h / 2); 
                    }
                    syncTo2D(obj.id, e.object.position.x, e.object.position.y, e.object.position.z);
                }
            });
            dragControls.addEventListener('dragend', (e) => { 
                orbitControls.enabled = true; 
                saveToState(e.object);
                pushHistory();
            });

            // 雙擊偵測 (支援手機觸控與滑鼠)
            let lastTap = 0;
            renderer.domElement.addEventListener('pointerup', (e) => {
                if (dragControls._dragging) return;
                const now = Date.now();
                if (now - lastTap < 400) {
                    const rect = renderer.domElement.getBoundingClientRect();
                    const mouse = new THREE.Vector2(((e.clientX - rect.left) / rect.width) * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1);
                    const raycaster = new THREE.Raycaster();
                    raycaster.setFromCamera(mouse, camera);
                    const intersects = raycaster.intersectObjects(draggableMeshes, true);
                    if (intersects.length > 0) {
                        let target = intersects[0].object;
                        while(target.parent && target.parent.type !== 'Scene' && !target.userData.id) target = target.parent;
                        if(target.userData.id) openEditModal(target.userData.id);
                    }
                    lastTap = 0;
                } else { lastTap = now; }
            });

            animate();
            resetViews();
        }

        function animate() {
            requestAnimationFrame(animate);
            orbitControls.update();
            renderer.render(scene, camera);
            if(appMode === 'ROOM') syncCameraTo2D();
        }

        // --- 2. 雙螢幕同步 (攝影機與2D平移) ---
        let isDraggingCamera = false;
        const camMarker = document.getElementById('camera-marker');
        
        function syncCameraTo2D() {
            if (isDraggingCamera || appMode !== 'ROOM') return;
            camMarker.style.left = (camera.position.x * SCALE_2D) + 'px';
            camMarker.style.top = (camera.position.z * SCALE_2D) + 'px';
            const angle = Math.atan2(orbitControls.target.z - camera.position.z, orbitControls.target.x - camera.position.x) * (180 / Math.PI) + 90;
            camMarker.style.transform = `translate(-50%, -50%) rotate(${angle}deg)`;
        }

        camMarker.addEventListener('pointerdown', (e) => { isDraggingCamera = true; e.stopPropagation(); });
        document.addEventListener('pointermove', (e) => {
            if (isDraggingCamera && appMode === 'ROOM') {
                const fpRect = document.getElementById('view-2d').getBoundingClientRect();
                const cx = (e.clientX - fpRect.left - fpRect.width/2 - panX) / SCALE_2D;
                const cz = (e.clientY - fpRect.top - fpRect.height/2 - panY) / SCALE_2D;
                const dx = orbitControls.target.x - camera.position.x;
                const dz = orbitControls.target.z - camera.position.z;
                camera.position.x = cx; camera.position.z = cz;
                orbitControls.target.set(cx + dx, orbitControls.target.y, cz + dz);
            }
        });
        document.addEventListener('pointerup', () => isDraggingCamera = false);

        // 2D 畫布平移控制
        let isPanning2D = false, panStartX, panStartY, panX = 0, panY = 0;
        const fpContainer = document.getElementById('floor-plan-container');
        document.getElementById('view-2d').addEventListener('pointerdown', (e) => {
            if (e.target.id === 'view-2d') { isPanning2D = true; panStartX = e.clientX - panX; panStartY = e.clientY - panY; }
        });
        document.addEventListener('pointermove', (e) => {
            if (isPanning2D) { panX = e.clientX - panStartX; panY = e.clientY - panStartY; fpContainer.style.transform = `translate(calc(-50% + ${panX}px), calc(-50% + ${panY}px))`; }
        });
        document.addEventListener('pointerup', () => isPanning2D = false);

        // --- 3. 物件生成與構建 ---
        function addObj(type, customData = null) {
            const id = customData ? customData.id : generateId();
            let w=100, h=100, d=100, color='#ffffff', name='物件', y=0;

            if (!customData) {
                if(type === 'cabinet') { w=75; h=235; d=24; color='#3d2b1f'; name='系統櫃'; }
                else if(type === 'wardrobe') { w=120; h=240; d=60; color='#8b5a2b'; name='大衣櫃'; }
                else if(type === 'sofa') { w=200; h=80; d=90; color='#3b82f6'; name='沙發'; }
                else if(type === 'bed') { w=150; h=50; d=200; color='#e5e7eb'; name='雙人床'; }
                else if(type === 'tv') { w=120; h=140; d=30; color='#1f2937'; name='電視牆'; }
                else if(type === 'bathtub') { w=160; h=60; d=80; color='#ffffff'; name='浴缸'; }
                else if(type === 'plant') { w=40; h=120; d=40; color='#22c55e'; name='盆栽'; }
                else if(type === 'wall') { w=300; h=280; d=15; color='#f3f4f6'; name='牆面'; }
                else if(type === 'floor') { w=400; h=2; d=400; color='#d1d5db'; name='木地板'; y = -1;}
                else if(type === 'toy') { w=15; h=20; d=15; color='#ef4444'; name='公仔'; y=50; }
            }

            const objData = customData || { id, type, name, w, h, d, x: 0, y, z: 0, rot: 0, color, img: null, shelves: [] };
            if (type === 'cabinet' && objData.shelves.length === 0) objData.shelves = [{h: 65}, {h: 35}, {h: 35}, {h: 35}, {h: 25}, {h: 20}];
            
            if(!customData) { objectsData.push(objData); pushHistory(); }
            buildObject(objData);
        }

        function rebuildEntireScene() {
            // 清空 3D
            draggableMeshes.forEach(m => scene.remove(m)); draggableMeshes = [];
            // 清空 2D (保留相機)
            const cam = document.getElementById('camera-marker');
            fpContainer.innerHTML = ''; fpContainer.appendChild(cam);
            
            // 根據模式過濾重建
            objectsData.forEach(obj => {
                if (appMode === 'CABINET' && obj.type !== 'cabinet' && obj.type !== 'toy') return; // 櫃體模式只畫櫃子跟玩具
                buildObject(obj);
            });
        }

        function buildObject(data) {
            // 1. 建立 3D Mesh
            let mesh;
            const mat = data.img ? new THREE.MeshStandardMaterial({map: textureLoader.load(data.img)}) : new THREE.MeshStandardMaterial({color: data.color});
            
            if (data.type === 'cabinet') {
                mesh = new THREE.Group();
                const t = 2.5; // 板厚
                mesh.add(new THREE.Mesh(new THREE.BoxGeometry(t, data.h, data.d), mat).translateX(-data.w/2+t/2));
                mesh.add(new THREE.Mesh(new THREE.BoxGeometry(t, data.h, data.d), mat).translateX(data.w/2-t/2));
                mesh.add(new THREE.Mesh(new THREE.BoxGeometry(data.w, t, data.d), mat).translateY(data.h/2-t/2));
                mesh.add(new THREE.Mesh(new THREE.BoxGeometry(data.w, t, data.d), mat).translateY(-data.h/2+t/2));
                mesh.add(new THREE.Mesh(new THREE.BoxGeometry(data.w, data.h, t), mat).translateZ(-data.d/2+t/2));
                let currY = -data.h/2 + t;
                data.shelves.forEach(shelf => {
                    currY += parseFloat(shelf.h);
                    if(currY < data.h/2 - t) mesh.add(new THREE.Mesh(new THREE.BoxGeometry(data.w - t*2, t, data.d), mat).translateY(currY));
                });
            } else if (data.type === 'sofa') {
                mesh = new THREE.Group();
                mesh.add(new THREE.Mesh(new THREE.BoxGeometry(data.w, data.h*0.4, data.d), mat).translateY(-data.h*0.3));
                mesh.add(new THREE.Mesh(new THREE.BoxGeometry(data.w, data.h, data.d*0.2), mat).translateZ(-data.d*0.4));
                mesh.add(new THREE.Mesh(new THREE.BoxGeometry(data.w*0.1, data.h*0.7, data.d), mat).translateX(-data.w*0.45).translateY(-data.h*0.15));
                mesh.add(new THREE.Mesh(new THREE.BoxGeometry(data.w*0.1, data.h*0.7, data.d), mat).translateX(data.w*0.45).translateY(-data.h*0.15));
            } else if (data.type === 'bed') {
                mesh = new THREE.Group();
                mesh.add(new THREE.Mesh(new THREE.BoxGeometry(data.w, data.h*0.3, data.d), new THREE.MeshStandardMaterial({color: 0x8b5a2b})).translateY(-data.h*0.35));
                mesh.add(new THREE.Mesh(new THREE.BoxGeometry(data.w*0.95, data.h*0.4, data.d*0.95), mat));
                mesh.add(new THREE.Mesh(new THREE.BoxGeometry(data.w, data.h, data.d*0.1), new THREE.MeshStandardMaterial({color: 0x8b5a2b})).translateZ(-data.d*0.45));
            } else if (data.type === 'plant') {
                mesh = new THREE.Group();
                mesh.add(new THREE.Mesh(new THREE.CylinderGeometry(data.w*0.4, data.w*0.3, data.h*0.3), new THREE.MeshStandardMaterial({color: 0x884422})).translateY(-data.h*0.35));
                mesh.add(new THREE.Mesh(new THREE.IcosahedronGeometry(data.w*0.6, 1), mat).translateY(data.h*0.2));
            } else {
                mesh = new THREE.Mesh(new THREE.BoxGeometry(data.w, data.h, data.d), mat);
            }

            mesh.traverse(child => { if (child.isMesh) { child.castShadow = true; child.receiveShadow = true; } });
            mesh.position.set(data.x, data.y + data.h/2, data.z);
            mesh.rotation.y = THREE.MathUtils.degToRad(data.rot);
            mesh.userData = { id: data.id };
            scene.add(mesh);
            draggableMeshes.push(mesh);

            // 2. 建立 2D DOM (依據模式決定繪製方式)
            const div = document.createElement('div');
            div.id = '2d_' + data.id;
            div.className = 'map-item';
            div.style.backgroundColor = data.img ? '#555' : data.color;
            if(data.img) { div.style.backgroundImage = `url(${data.img})`; div.style.backgroundSize = 'cover'; }
            
            if (appMode === 'ROOM') {
                // 俯視圖 (X-Z)
                div.style.width = (data.w * SCALE_2D) + 'px';
                div.style.height = (data.d * SCALE_2D) + 'px';
                div.style.left = (data.x * SCALE_2D) + 'px';
                div.style.top = (data.z * SCALE_2D) + 'px';
                div.style.transform = `translate(-50%, -50%) rotate(${data.rot}deg)`;
                div.innerText = data.name.substring(0, 4);
                if (data.type === 'toy') div.style.borderRadius = '50%';
            } else {
                // 立面圖 (X-Y)
                div.style.width = (data.w * SCALE_2D) + 'px';
                div.style.height = (data.h * SCALE_2D) + 'px';
                div.style.left = (data.x * SCALE_2D) + 'px';
                div.style.top = (-data.y - data.h/2) * SCALE_2D + 'px'; // Y軸向上，Top為負
                div.innerText = data.name;
                div.style.alignItems = 'flex-end'; div.style.paddingBottom = '2px'; // 重力視覺貼齊底
            }

            // 2D 拖曳
            let isDragging = false, startX, startY, origLeft, origTop;
            div.addEventListener('pointerdown', (e) => {
                isDragging = true; startX = e.clientX; startY = e.clientY;
                origLeft = parseFloat(div.style.left); origTop = parseFloat(div.style.top);
                orbitControls.enabled = false; div.setPointerCapture(e.pointerId); e.stopPropagation();
            });
            div.addEventListener('pointermove', (e) => {
                if(!isDragging) return;
                const newX = (origLeft + (e.clientX - startX)) / SCALE_2D;
                const newY_or_Z = (origTop + (e.clientY - startY)) / SCALE_2D;
                div.style.left = (newX * SCALE_2D) + 'px'; div.style.top = (newY_or_Z * SCALE_2D) + 'px';
                
                mesh.position.x = newX;
                if (appMode === 'ROOM') { mesh.position.z = newY_or_Z; } 
                else { mesh.position.y = -newY_or_Z; } // 更新Y高度
            });
            div.addEventListener('pointerup', (e) => {
                isDragging = false; orbitControls.enabled = true;
                const obj = objectsData.find(o => o.id === data.id);
                if(obj) { obj.x = mesh.position.x; if(appMode==='ROOM') obj.z = mesh.position.z; else obj.y = mesh.position.y - obj.h/2; }
                pushHistory();
            });

            // 2D 雙擊編輯
            let clickTimer = null;
            div.addEventListener('pointerup', (e) => {
                if(Math.abs(e.clientX - startX)>5) return; 
                if (clickTimer == null) { clickTimer = setTimeout(() => { clickTimer = null; }, 400); } 
                else { clearTimeout(clickTimer); clickTimer = null; openEditModal(data.id); }
            });

            fpContainer.appendChild(div);
        }

        function syncTo2D(id, x, y, z) {
            const div = document.getElementById('2d_' + id);
            if(div) {
                div.style.left = (x * SCALE_2D) + 'px';
                if(appMode === 'ROOM') div.style.top = (z * SCALE_2D) + 'px';
                else div.style.top = (-y * SCALE_2D) + 'px';
            }
        }

        function saveToState(mesh) {
            const obj = objectsData.find(o => o.id === mesh.userData.id);
            if(obj) { obj.x = mesh.position.x; obj.y = mesh.position.y - obj.h/2; obj.z = mesh.position.z; }
        }

        // --- 4. 編輯與設定面板 ---
        function openEditModal(id) {
            const obj = objectsData.find(o => o.id === id);
            if(!obj) return;
            activeEditId = id;
            document.getElementById('edit-title').innerText = obj.name + ' 設定';
            ['name','w','h','d','x','y','z','rot'].forEach(k => document.getElementById(`edit-${k}`).value = obj[k]);
            
            const shelfManager = document.getElementById('cabinet-shelves-manager');
            const list = document.getElementById('shelves-list');
            list.innerHTML = '';
            if (obj.type === 'cabinet') {
                shelfManager.classList.remove('hidden');
                obj.shelves.forEach((s, idx) => {
                    list.innerHTML += `<div class="flex items-center gap-2"><span class="text-white text-[10px] w-12">第${idx+1}層</span><input type="number" value="${s.h}" class="flex-1 bg-gray-800 text-white border border-gray-600 rounded px-1 py-1 text-xs" onchange="updateShelf(${idx}, this.value)"><button onclick="removeShelf(${idx})" class="text-red-500 text-xs px-2 py-1 bg-gray-800 rounded border border-red-900">刪</button></div>`;
                });
            } else { shelfManager.classList.add('hidden'); }
            
            openModal('edit-modal');
        }

        function updateShelf(idx, val) { const obj = objectsData.find(o => o.id === activeEditId); if(obj) obj.shelves[idx].h = val; }
        function addShelfToCabinet() { const obj = objectsData.find(o => o.id === activeEditId); if(obj) obj.shelves.push({h: 30}); openEditModal(activeEditId); }
        function removeShelf(idx) { const obj = objectsData.find(o => o.id === activeEditId); if(obj) obj.shelves.splice(idx, 1); openEditModal(activeEditId); }

        function saveObjectEdit() {
            if(!activeEditId) return;
            const obj = objectsData.find(o => o.id === activeEditId);
            ['w','h','d','x','y','z','rot'].forEach(k => obj[k] = parseFloat(document.getElementById(`edit-${k}`).value) || 0);
            obj.name = document.getElementById('edit-name').value || '物件';
            rebuildEntireScene(); pushHistory(); closeModal('edit-modal');
        }

        function deleteObject() {
            if(!activeEditId || !confirm('確定刪除此物件？')) return;
            objectsData = objectsData.filter(o => o.id !== activeEditId);
            rebuildEntireScene(); pushHistory(); closeModal('edit-modal');
        }

        document.getElementById('image-uploader').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file || !activeEditId) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                const obj = objectsData.find(o => o.id === activeEditId);
                obj.img = event.target.result;
                rebuildEntireScene(); pushHistory();
            };
            reader.readAsDataURL(file); e.target.value = '';
        });

        // --- 5. 匯出 HTML 存檔 ---
        function exportHTML() {
            document.getElementById('saved-state').textContent = JSON.stringify(objectsData);
            const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
            const blob = new Blob([htmlContent], { type: 'text/html' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'RoomPlanner_Export.html'; a.click();
        }

        function loadFromState() {
            try {
                const saved = JSON.parse(document.getElementById('saved-state').textContent);
                if (saved && saved.length > 0) {
                    objectsData = saved; historyStack.push(JSON.parse(JSON.stringify(objectsData)));
                    rebuildEntireScene(); return true;
                }
            } catch(e) {}
            return false;
        }

                {n:'Pickle R', w:7.6, h:15.2, d:7, c:'#84cc16', x:-25, y:195}, {n:'Pickle s', w:6.4, h:9.5, d:5, c:'#84cc16', x:-16, y:195}, {n:'超人狗', w:10, h:16, d:7, c:'#3b82f6', x:-6, y:195}, {n:'ELLO', w:7.5, h:11, d:7, c:'#84cc16', x:5, y:195},

        // --- 啟動 ---
        window.onload = () => {
            init3D();
            if(!loadFromState()) {
                addObj('floor'); addObj('wall', {id: generateId(), type: 'wall', name: '主牆面', w: 400, h: 280, d: 15, x: 0, y: 0, z: -100, rot: 0, color: '#f3f4f6', img: null, shelves: []});
                pushHistory();
            }
        };

        window.addEventListener('resize', () => {
            if(camera && renderer) {
                const container = document.getElementById('view-3d');
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            }
        });
    </script>
