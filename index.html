<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D 室內裝潢與系統櫃旗艦規劃系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/DragControls.js"></script>
    <style>
        :root { --scale: 2px; }
        body { margin: 0; overflow: hidden; background-color: #121212; color: #e0e0e0; font-family: 'Inter', sans-serif; touch-action: none; user-select: none; }
        
        /* 版面配置 */
        #app-container { display: flex; flex-direction: column; height: 100dvh; width: 100vw; position: relative; }
        #view-3d { flex: 1; min-height: 50vh; background: #0a0a0a; position: relative; z-index: 1; }
        #view-2d { flex: 1; min-height: 40vh; background-color: #1a1a1a; background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 20px 20px; background-position: center center; position: relative; overflow: hidden; border-top: 4px solid #3d2b1f; touch-action: none; transform-origin: center; }
        
        /* 工具列設計 (極簡圖示化) */
        #menu-btn { position: absolute; top: 15px; left: 15px; z-index: 100; background: rgba(30,30,30,0.8); color: white; border: 1px solid #555; width: 45px; height: 45px; border-radius: 8px; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(5px); box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: 0.2s; }
        #menu-btn:hover { background: #d97706; }
        
        #quick-tools { position: absolute; top: 15px; right: 15px; z-index: 100; display: flex; gap: 10px; }
        .tool-btn { background: rgba(30,30,30,0.8); color: white; border: 1px solid #555; width: 45px; height: 45px; border-radius: 8px; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(5px); box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: 0.2s; }
        .tool-btn:hover { background: #d97706; }
        .tool-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        /* 左側系統選單 (預設收合) */
        #sidebar { position: absolute; left: -320px; top: 0; height: 100%; width: 320px; background: rgba(20, 20, 20, 0.95); backdrop-filter: blur(10px); z-index: 200; transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; border-right: 1px solid #444; box-shadow: 5px 0 25px rgba(0,0,0,0.7); }
        #sidebar.open { left: 0; }
        #sidebar-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); z-index: 199; display: none; }
        #sidebar.open ~ #sidebar-overlay { display: block; }

        /* 2D 平面圖物件 */
        #floor-plan-container { position: absolute; top: 50%; left: 50%; width: 0; height: 0; transition: transform 0.2s ease-out; }
        .map-item { position: absolute; transform: translate(-50%, -50%); box-sizing: border-box; cursor: grab; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; color: white; text-shadow: 1px 1px 2px black; box-shadow: 0 4px 6px rgba(0,0,0,0.5); border-radius: 2px; transition: filter 0.2s, outline 0.2s; border: 1px solid rgba(255,255,255,0.3); background-size: cover; background-position: center; }
        .map-item:hover { filter: brightness(1.2); outline: 2px solid #d97706; z-index: 20 !important; }
        .map-item:active { cursor: grabbing; }
        
        /* 攝影機圖示 */
        #camera-marker { position: absolute; width: 30px; height: 30px; transform: translate(-50%, -50%); cursor: grab; z-index: 100; }
        #camera-marker .dot { width: 14px; height: 14px; background: #3b82f6; border-radius: 50%; margin: auto; position: absolute; top: 8px; left: 8px; box-shadow: 0 0 10px #3b82f6, inset 0 0 4px white; border: 2px solid white; }
        #camera-marker .cone { width: 0; height: 0; border-left: 20px solid transparent; border-right: 20px solid transparent; border-bottom: 40px solid rgba(59, 130, 246, 0.4); position: absolute; top: -30px; left: -5px; pointer-events: none; }

        /* 提示標籤與對話框 */
        .modal { z-index: 10000; }
        .mode-badge { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); padding: 8px 16px; border-radius: 20px; border: 1px solid #d97706; color: #d97706; font-weight: bold; z-index: 50; pointer-events: none; text-transform: uppercase; letter-spacing: 1px; font-size: 14px; box-shadow: 0 0 15px rgba(217, 119, 6, 0.3); }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }

        @media (max-width: 768px) {
            #sidebar { width: 85%; left: -85%; }
            .tool-btn, #menu-btn { width: 40px; height: 40px; font-size: 18px; }
        }
    </style>
</head>
<body>
    <div id="app-container">
        <!-- 全局工具列 -->
        <button id="menu-btn" onclick="toggleMenu()" title="系統選單">☰</button>
        <div id="quick-tools">
            <button class="tool-btn" onclick="undo()" id="btn-undo" title="上一步">↩</button>
            <button class="tool-btn" onclick="redo()" id="btn-redo" title="下一步">↪</button>
            <button class="tool-btn" onclick="resetViews()" title="視角與比例回正">⌂</button>
        </div>

        <!-- 左側統包選單 -->
        <div id="sidebar">
            <div class="flex justify-between items-center p-4 border-b border-gray-700 bg-gray-900">
                <h2 class="text-lg font-bold text-white flex items-center gap-2">🛠️ 系統選單</h2>
                <button onclick="toggleMenu()" class="text-gray-400 hover:text-white text-2xl font-bold">✕</button>
            </div>
            
            <div class="flex-1 overflow-y-auto p-4 space-y-5" id="sidebar-content">
                <!-- 裝潢模式工具區 (大宇宙) -->
                <div id="room-tools">
                    <h3 class="text-xs font-bold text-gray-400 mb-2 border-b border-gray-700 pb-1">🧱 裝潢空間設定</h3>
                    <div class="grid grid-cols-2 gap-2 mb-4">
                        <button onclick="addRoomObj('wall')" class="bg-gray-800 hover:bg-gray-700 text-xs py-2.5 rounded border border-gray-600 shadow-sm text-gray-200">新增牆面</button>
                        <button onclick="addRoomObj('floor')" class="bg-gray-800 hover:bg-gray-700 text-xs py-2.5 rounded border border-gray-600 shadow-sm text-gray-200">新增木地板</button>
                    </div>

                    <h3 class="text-xs font-bold text-gray-400 mb-2 border-b border-gray-700 pb-1">🪑 裝潢家具庫</h3>
                    <div class="grid grid-cols-2 gap-2 mb-4">
                        <button onclick="addRoomObj('cabinet')" class="bg-amber-900/60 hover:bg-amber-800 text-amber-400 text-xs py-2.5 rounded border border-amber-700 col-span-2 font-bold shadow-md">+ 新增一座系統櫃</button>
                        <button onclick="addRoomObj('wardrobe')" class="bg-gray-800 text-xs py-2 rounded border border-gray-600">大衣櫃</button>
                        <button onclick="addRoomObj('sofa')" class="bg-gray-800 text-xs py-2 rounded border border-gray-600">沙發</button>
                        <button onclick="addRoomObj('bed')" class="bg-gray-800 text-xs py-2 rounded border border-gray-600">雙人床</button>
                        <button onclick="addRoomObj('tv')" class="bg-gray-800 text-xs py-2 rounded border border-gray-600">電視牆</button>
                        <button onclick="addRoomObj('bathtub')" class="bg-gray-800 text-xs py-2 rounded border border-gray-600">浴缸</button>
                        <button onclick="addRoomObj('plant')" class="bg-green-900/40 text-green-400 text-xs py-2 border border-green-800 rounded">落地盆栽</button>
                    </div>

                    <div class="bg-blue-900/30 border border-blue-800 p-3 rounded mt-4">
                        <p class="text-[11px] text-blue-300">💡 提示：在畫面上對著「系統櫃」雙擊，即可進入【系統櫃專屬編輯模式】，自訂層板與擺放玩具。</p>
                    </div>
                </div>

                <!-- 系統櫃編輯模式專用區 (小宇宙) -->
                <div id="cabinet-tools" class="hidden flex-col h-full">
                    <div class="bg-amber-900/30 border border-amber-800 p-3 rounded mb-4">
                        <h3 class="text-sm font-bold text-amber-500 mb-1">正在編輯系統櫃</h3>
                        <p class="text-[11px] text-gray-300">您現在處於內部編輯維度。所有的玩具排版與材質更換僅套用於此櫃體。</p>
                    </div>
                    
                    <button onclick="exitCabinetMode()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded mb-4 shadow-lg border border-emerald-400 flex items-center justify-center gap-2">
                        <span>💾</span> 儲存變更並返回裝潢模式
                    </button>

                    <h3 class="text-xs font-bold text-gray-400 mb-2 border-b border-gray-700 pb-1 mt-2">🧸 玩具與公仔管理</h3>
                    <button onclick="addCabinetToy()" class="w-full bg-blue-600 hover:bg-blue-500 text-white text-xs py-2.5 rounded font-bold mb-3 shadow shadow-blue-900 border border-blue-500">+ 新增單一玩具 (暫存區)</button>
                    
                    <!-- 專屬暫存區 -->
                    <div class="flex-1 bg-gray-950 border border-gray-700 rounded-lg p-2 flex flex-col mb-4">
                        <span class="text-[10px] text-gray-500 text-center block mb-2">▼ 暫存與待佈置區 (拖曳至右側) ▼</span>
                        <div id="toy-bin" class="flex-1 overflow-y-auto grid grid-cols-2 gap-2 content-start min-h-[100px]"></div>
                    </div>
                </div>
            </div>

            <!-- 全局匯出區 -->
            <div class="p-4 border-t border-gray-700 bg-gray-900">
                <button onclick="load54ToysUltimate()" class="w-full bg-purple-700 hover:bg-purple-600 text-white text-[11px] py-2.5 rounded font-bold mb-3 shadow border border-purple-500 flex justify-center gap-1">
                    <span>✨</span> 旗艦一鍵載入：裝潢 + 54件經典陣容
                </button>
                <button onclick="exportHTML()" class="w-full py-2.5 bg-gray-700 hover:bg-gray-600 text-gray-200 font-bold rounded text-[11px] border border-gray-500 shadow-md">
                    💾 匯出 HTML 原始碼 (本地存檔)
                </button>
            </div>
        </div>
        <div id="sidebar-overlay" onclick="toggleMenu()"></div>

        <!-- 3D 視圖區 -->
        <div id="view-3d">
            <div class="absolute top-4 left-1/2 transform -translate-x-1/2 bg-black/60 px-3 py-1.5 rounded-lg text-[11px] text-gray-300 pointer-events-none z-10 border border-gray-600 shadow-lg tracking-wide whitespace-nowrap" id="hint-3d">
                👆 3D 空間：左鍵旋轉 | 右鍵平移 | 雙擊物件編輯屬性
            </div>
        </div>

        <!-- 2D 平面圖區 -->
        <div id="view-2d">
            <div class="absolute top-4 left-1/2 transform -translate-x-1/2 bg-black/60 px-3 py-1.5 rounded-lg text-[11px] text-gray-300 pointer-events-none z-10 border border-gray-600 shadow-lg tracking-wide whitespace-nowrap" id="hint-2d">
                👇 2D 平面：拖曳藍點移動攝影機 | 拖曳家具 | 空白處平移畫布
            </div>
            <div id="floor-plan-container">
                <!-- 攝影機將在此生成 -->
            </div>
        </div>
        
        <div id="mode-indicator" class="mode-badge">🏠 總裝潢空間模式</div>
    </div>

    <!-- 統一編輯面板 (Modal) -->
    <div id="edit-modal" class="fixed inset-0 modal bg-black/80 hidden items-center justify-center backdrop-blur-sm px-4">
        <div class="bg-gray-900 border border-gray-600 rounded-xl p-5 max-w-sm w-full shadow-2xl max-h-[90vh] overflow-y-auto transform transition-all">
            <div class="flex justify-between items-center mb-4 border-b border-gray-700 pb-2">
                <h3 class="text-lg font-bold text-amber-500 flex items-center gap-2" id="edit-title">⚙️ 編輯屬性</h3>
                <button onclick="closeModal('edit-modal')" class="text-gray-400 hover:text-white font-bold text-xl">✕</button>
            </div>
            
            <p class="text-[10px] text-gray-400 mb-4 bg-gray-800 p-2 rounded">💡 提示：修改數值後將即時同步於 2D 與 3D 畫面。單位皆為公分 (cm)。</p>
            <input type="hidden" id="edit-id">
            
            <div class="space-y-4 mb-6">
                <div><label class="block text-gray-400 text-xs mb-1 font-bold">物件名稱</label><input type="text" id="edit-name" class="w-full bg-black text-white border border-gray-700 rounded px-3 py-2 text-sm focus:border-amber-500 focus:outline-none"></div>
                
                <div class="grid grid-cols-3 gap-3">
                    <div><label class="block text-gray-400 text-xs mb-1 font-bold">面寬 (W)</label><input type="number" id="edit-w" class="w-full bg-black text-white border border-gray-700 rounded px-2 py-2 text-sm text-center"></div>
                    <div><label class="block text-gray-400 text-xs mb-1 font-bold">高度 (H)</label><input type="number" id="edit-h" class="w-full bg-black text-white border border-gray-700 rounded px-2 py-2 text-sm text-center"></div>
                    <div><label class="block text-gray-400 text-xs mb-1 font-bold">深度 (D)</label><input type="number" id="edit-d" class="w-full bg-black text-white border border-gray-700 rounded px-2 py-2 text-sm text-center"></div>
                </div>
                
                <div class="grid grid-cols-3 gap-3" id="edit-pos-group">
                    <div><label class="block text-gray-400 text-xs mb-1 font-bold">左右 (X)</label><input type="number" id="edit-x" class="w-full bg-black text-white border border-gray-700 rounded px-2 py-2 text-sm text-center"></div>
                    <div><label class="block text-gray-400 text-xs mb-1 font-bold" id="label-y-z">前後 (Z)</label><input type="number" id="edit-yz" class="w-full bg-black text-white border border-gray-700 rounded px-2 py-2 text-sm text-center"></div>
                    <div><label class="block text-gray-400 text-xs mb-1 font-bold">旋轉角度</label><input type="number" id="edit-rot" class="w-full bg-black text-white border border-gray-700 rounded px-2 py-2 text-sm text-center"></div>
                </div>
                
                <!-- 專屬櫃體層板管理器 (僅編輯櫃體時出現) -->
                <div id="cabinet-shelves-manager" class="hidden mt-4 p-3 bg-gray-800 border border-gray-700 rounded-lg">
                    <label class="block text-amber-500 text-xs font-bold mb-2 flex items-center gap-1"><span>📏</span> 內部層板淨高調整 (由下而上)</label>
                    <div id="shelves-list" class="space-y-2 max-h-40 overflow-y-auto pr-2 custom-scrollbar"></div>
                    <button onclick="addShelfToCabinet()" class="mt-3 w-full text-xs bg-gray-700 hover:bg-gray-600 py-2 rounded border border-gray-500 text-white shadow-sm">+ 往上疊加一層</button>
                </div>
            </div>
            
            <div class="flex flex-col space-y-3 border-t border-gray-700 pt-4">
                <button onclick="document.getElementById('image-uploader').click()" class="w-full py-2.5 bg-blue-900/50 hover:bg-blue-600 text-blue-300 hover:text-white font-bold rounded text-sm border border-blue-800 transition-colors flex justify-center gap-2"><span>🖼️</span> 上傳真實材質 / 圖片預覽</button>
                <div class="flex gap-2">
                    <button onclick="saveObjectEdit()" class="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded text-sm shadow-lg transition-colors">💾 儲存並套用</button>
                    <button onclick="deleteObject()" class="flex-1 py-2.5 border border-red-800 bg-red-900/30 text-red-400 hover:bg-red-600 hover:text-white font-bold rounded text-sm transition-colors" id="btn-delete-obj">✖ 刪除物件</button>
                </div>
            </div>
        </div>
    </div>
    <input type="file" id="image-uploader" accept="image/*" class="hidden">

    <!-- 儲存空間 -->
    <script id="saved-state" type="application/json">{}</script>

    <script>
        // --- 核心架構與狀態 ---
        let appMode = 'ROOM'; // 'ROOM' (裝潢俯視) | 'CABINET' (單一櫃體立面編輯)
        let editingCabinetId = null; 
        
        let roomData = {
            objects: [], // 包含牆壁、家具、以及作為單一元件的系統櫃
            bin: []      // 裝潢模式無 bin，但保留結構
        };
        let historyStack = [];
        let redoStack = [];
        
        // 渲染引擎變數
        const SCALE_2D = 2; // 2D 畫布比例 (1cm = 2px)
        let zoom2D = 1;     // 2D 縮放
        let panX = 0, panY = 0;
        
        let scene, camera, renderer, orbitControls, dragControls;
        let draggableMeshes = [];
        let activeEditId = null;
        const textureLoader = new THREE.TextureLoader();
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();

        // 輔助函式
        const generateId = (prefix) => prefix + '_' + Math.random().toString(36).substr(2, 9);
        const getEl = (id) => document.getElementById(id);
        const openModal = (id) => { getEl(id).classList.remove('hidden'); getEl(id).classList.add('flex'); };
        const closeModal = (id) => { getEl(id).classList.add('hidden'); getEl(id).classList.remove('flex'); };
        
        // UI 互動
        function toggleMenu() { getEl('sidebar').classList.toggle('open'); }
        
        // --- 歷史紀錄系統 ---
        function saveState() {
            historyStack.push(JSON.parse(JSON.stringify(roomData)));
            redoStack = [];
            if(historyStack.length > 30) historyStack.shift();
            updateHistoryBtns();
        }
        function undo() {
            if(historyStack.length > 1) {
                redoStack.push(historyStack.pop());
                roomData = JSON.parse(JSON.stringify(historyStack[historyStack.length - 1]));
                forceRebuildAll(); updateHistoryBtns();
            }
        }
        function redo() {
            if(redoStack.length > 0) {
                const state = redoStack.pop();
                historyStack.push(JSON.parse(JSON.stringify(state)));
                roomData = JSON.parse(JSON.stringify(state));
                forceRebuildAll(); updateHistoryBtns();
            }
        }
        function updateHistoryBtns() {
            getEl('btn-undo').disabled = historyStack.length <= 1;
            getEl('btn-redo').disabled = redoStack.length === 0;
        }

        // --- 視角回正與比例尺 ---
        function resetViews() {
            // 3D 回正
            if(appMode === 'ROOM') {
                camera.position.set(0, 500, 600);
                orbitControls.target.set(0, 0, 0);
            } else {
                camera.position.set(0, 150, 400);
                orbitControls.target.set(0, 100, 0);
            }
            orbitControls.update();
            
            // 2D 畫布置中與縮放還原
            panX = 0; panY = 0; zoom2D = 1;
            update2DTransform();
        }
        
        function update2DTransform() {
            getEl('floor-plan-container').style.transform = `translate(calc(-50% + ${panX}px), calc(-50% + ${panY}px)) scale(${zoom2D})`;
        }

        // --- 維度切換系統 (雙螢幕架構核心) ---
        function enterCabinetMode(cabinetId) {
            appMode = 'CABINET';
            editingCabinetId = cabinetId;
            
            // UI 切換
            getEl('room-tools').classList.add('hidden');
            getEl('cabinet-tools').classList.remove('hidden');
            getEl('cabinet-tools').classList.add('flex');
            getEl('mode-indicator').innerText = '🛠️ 櫃體內部編輯維度';
            getEl('mode-indicator').style.color = '#10b981';
            getEl('mode-indicator').style.borderColor = '#10b981';
            getEl('hint-2d').innerText = '👇 2D 立面圖：呈現高度與寬度 | 拖曳玩具放入層板';
            getEl('camera-marker').style.display = 'none'; // 隱藏裝潢視角點
            
            // 開啟側邊欄方便選玩具
            if(!getEl('sidebar').classList.contains('open')) toggleMenu();
            
            forceRebuildAll();
            resetViews();
        }

        function exitCabinetMode() {
            appMode = 'ROOM';
            editingCabinetId = null;
            
            // UI 切換
            getEl('cabinet-tools').classList.add('hidden');
            getEl('cabinet-tools').classList.remove('flex');
            getEl('room-tools').classList.remove('hidden');
            getEl('mode-indicator').innerText = '🏠 總裝潢空間模式';
            getEl('mode-indicator').style.color = '#d97706';
            getEl('mode-indicator').style.borderColor = '#d97706';
            getEl('hint-2d').innerText = '👇 2D 俯視平面：拖曳藍點移動攝影機 | 雙擊櫃體編輯內部';
            getEl('camera-marker').style.display = 'block';
            
            toggleMenu(); // 收合選單
            forceRebuildAll();
            resetViews();
        }

        // --- 1. 初始化 Three.js 雙螢幕 ---
        function init3D() {
            const container = getEl('view-3d');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111111);
            
            camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 1, 5000);
            renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);
            
            orbitControls = new THREE.OrbitControls(camera, renderer.domElement);
            orbitControls.enableDamping = true; orbitControls.dampingFactor = 0.05;

            // 燈光
            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(300, 600, 400);
            dirLight.castShadow = true;
            dirLight.shadow.camera.top = 500; dirLight.shadow.camera.bottom = -500;
            dirLight.shadow.camera.left = -500; dirLight.shadow.camera.right = 500;
            scene.add(dirLight);
            
            // 地板網格
            const grid = new THREE.GridHelper(2000, 100, 0x444444, 0x222222); 
            grid.position.y = -0.1; 
            scene.add(grid);

            // 3D 拖曳系統
            dragControls = new THREE.DragControls(draggableMeshes, camera, renderer.domElement);
            dragControls.addEventListener('dragstart', (e) => { orbitControls.enabled = false; e.object.material.opacity = 0.5; e.object.material.transparent = true; });
            dragControls.addEventListener('drag', (e) => {
                const mesh = e.object;
                const objData = findObjById(mesh.userData.id);
                if(!objData) return;
                
                if (appMode === 'ROOM') {
                    mesh.position.y = (objData.y || 0) + objData.h/2; // 鎖定 Y 軸 (貼地)
                    syncTo2D(objData.id, mesh.position.x, mesh.position.z);
                } else if (appMode === 'CABINET') {
                    // 立面模式下，只能移動玩具，不能移動櫃體框架
                    if(objData.type !== 'toy') return;
                    mesh.position.z = 0; // 鎖定深度
                    syncTo2D(objData.id, mesh.position.x, mesh.position.y - objData.h/2);
                }
            });
            dragControls.addEventListener('dragend', (e) => { 
                orbitControls.enabled = true; 
                e.object.material.opacity = 1.0; e.object.material.transparent = false;
                
                const mesh = e.object;
                const objData = findObjById(mesh.userData.id);
                if(objData) {
                    objData.x = mesh.position.x;
                    if(appMode === 'ROOM') objData.z = mesh.position.z;
                    else if(appMode === 'CABINET') objData.y = mesh.position.y - objData.h/2;
                }
                saveState(); 
            });

            // 雙擊偵測 (雙平台支援)
            let lastTap = 0;
            renderer.domElement.addEventListener('pointerup', (e) => {
                if (dragControls._dragging) return;
                const now = Date.now();
                if (now - lastTap < 300) {
                    const rect = renderer.domElement.getBoundingClientRect();
                    mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
                    mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
                    raycaster.setFromCamera(mouse, camera);
                    const intersects = raycaster.intersectObjects(draggableMeshes, true);
                    
                    if (intersects.length > 0) {
                        let target = intersects[0].object;
                        while(target.parent && target.parent.type !== 'Scene' && !target.userData.id) target = target.parent;
                        if(target.userData.id) handleDoubleClick(target.userData.id);
                    }
                    lastTap = 0;
                } else { lastTap = now; }
            });

            animate();
            resetViews();
        }

        function animate() {
            requestAnimationFrame(animate);
            orbitControls.update();
            renderer.render(scene, camera);
            if(appMode === 'ROOM') syncCameraTo2D();
        }

        // --- 2. 攝影機與 2D 畫布連動 ---
        let isDraggingCamera = false;
        const camMarker = getEl('camera-marker');
        
        function syncCameraTo2D() {
            if (isDraggingCamera || appMode !== 'ROOM') return;
            camMarker.style.left = (camera.position.x * SCALE_2D) + 'px';
            camMarker.style.top = (camera.position.z * SCALE_2D) + 'px';
            const angle = Math.atan2(orbitControls.target.z - camera.position.z, orbitControls.target.x - camera.position.x) * (180 / Math.PI) + 90;
            camMarker.style.transform = `translate(-50%, -50%) rotate(${angle}deg)`;
        }

        camMarker.addEventListener('pointerdown', (e) => { isDraggingCamera = true; e.stopPropagation(); });
        document.addEventListener('pointermove', (e) => {
            if (isDraggingCamera && appMode === 'ROOM') {
                const fpRect = getEl('view-2d').getBoundingClientRect();
                // 考量 panX, panY 與 zoom
                const cx = ((e.clientX - fpRect.left - fpRect.width/2 - panX) / zoom2D) / SCALE_2D;
                const cz = ((e.clientY - fpRect.top - fpRect.height/2 - panY) / zoom2D) / SCALE_2D;
                const dx = orbitControls.target.x - camera.position.x;
                const dz = orbitControls.target.z - camera.position.z;
                camera.position.x = cx; camera.position.z = cz;
                orbitControls.target.set(cx + dx, orbitControls.target.y, cz + dz);
            }
        });
        document.addEventListener('pointerup', () => isDraggingCamera = false);

        // 2D 畫布平移與縮放控制
        let isPanning2D = false, panStartX, panStartY;
        const fpContainer = getEl('floor-plan-container');
        
        getEl('view-2d').addEventListener('pointerdown', (e) => {
            if (e.target.id === 'view-2d') { isPanning2D = true; panStartX = e.clientX - panX; panStartY = e.clientY - panY; }
        });
        document.addEventListener('pointermove', (e) => {
            if (isPanning2D) { panX = e.clientX - panStartX; panY = e.clientY - panStartY; update2DTransform(); }
        });
        document.addEventListener('pointerup', () => isPanning2D = false);
        
        getEl('view-2d').addEventListener('wheel', (e) => {
            e.preventDefault();
            zoom2D += e.deltaY * -0.001;
            zoom2D = Math.min(Math.max(0.3, zoom2D), 3); // 限制縮放
            update2DTransform();
        });

        // --- 3. 物件生成與建構系統 ---
        
        // A. 裝潢空間物件 (大宇宙)
        function addRoomObj(type) {
            const id = generateId('rm');
            let w=100, h=100, d=100, color='#ffffff', name='物件', y=0;

            if(type === 'cabinet') { w=75; h=235; d=24; color='#3d2b1f'; name='系統櫃組件'; }
            else if(type === 'wardrobe') { w=120; h=240; d=60; color='#5c4033'; name='大衣櫃'; }
            else if(type === 'sofa') { w=200; h=80; d=90; color='#3b82f6'; name='沙發'; }
            else if(type === 'bed') { w=150; h=50; d=200; color='#e5e7eb'; name='雙人床'; }
            else if(type === 'tv') { w=120; h=140; d=30; color='#1f2937'; name='電視牆'; }
            else if(type === 'bathtub') { w=160; h=60; d=80; color='#f8fafc'; name='浴缸'; }
            else if(type === 'plant') { w=40; h=120; d=40; color='#22c55e'; name='盆栽'; }
            else if(type === 'wall') { w=300; h=280; d=15; color='#f3f4f6'; name='牆面'; }
            else if(type === 'floor') { w=400; h=2; d=400; color='#d1d5db'; name='木地板'; y=-1;}

            const obj = { id, type, name, w, h, d, x:0, y, z:0, rot:0, color, img:null };
            
            // 系統櫃專屬內部屬性
            if(type === 'cabinet') {
                obj.shelves = [{h:65}, {h:35}, {h:35}, {h:35}, {h:25}, {h:20}];
                obj.toys = []; // 屬於這個櫃子的玩具
            }
            
            roomData.objects.push(obj);
            saveState(); forceRebuildAll();
        }

        // B. 櫃體內部玩具 (小宇宙)
        function addCabinetToy() {
            if(appMode !== 'CABINET' || !editingCabinetId) return;
            const cabinet = roomData.objects.find(o => o.id === editingCabinetId);
            if(!cabinet) return;
            
            const toy = { id: generateId('toy'), type: 'toy', name: '新公仔', w: 15, h: 20, d: 15, x: 0, y: 0, z: 0, color: '#ef4444', img: null };
            cabinet.toys.push(toy);
            // 預設將新玩具移至暫存區 (Bin)
            moveToyToBin(cabinet, toy.id);
            saveState(); forceRebuildAll();
        }

        // 核心：根據模式重建整個世界
        function forceRebuildAll() {
            // 清理 3D
            draggableMeshes.forEach(m => scene.remove(m));
            draggableMeshes = [];
            
            // 清理 2D (保留相機)
            const cam = getEl('camera-marker');
            fpContainer.innerHTML = ''; 
            fpContainer.appendChild(cam);
            getEl('toy-bin').innerHTML = ''; // 清空暫存區 UI
            
            if (appMode === 'ROOM') {
                // 渲染整個房間
                roomData.objects.forEach(obj => renderObject(obj));
            } else if (appMode === 'CABINET' && editingCabinetId) {
                // 僅渲染選定的櫃體與其內部玩具
                const cab = roomData.objects.find(o => o.id === editingCabinetId);
                if (cab) {
                    renderObject(cab, true); // true 代表以「展開」模式渲染
                    // 渲染放在櫃子裡的玩具
                    cab.toys.filter(t => !t.inBin).forEach(toy => renderObject(toy));
                    // 渲染暫存區的玩具 (純 2D HTML)
                    cab.toys.filter(t => t.inBin).forEach(toy => renderBinItem(toy));
                }
            }
        }

        function renderObject(data, isExpandedCabinet = false) {
            // --- 1. 建立 3D Mesh ---
            let mesh;
            const mat = data.img ? new THREE.MeshStandardMaterial({map: textureLoader.load(data.img)}) : new THREE.MeshStandardMaterial({color: data.color});
            
            if (data.type === 'cabinet') {
                mesh = new THREE.Group();
                const t = 2.5; // 板厚
                // 外框
                mesh.add(new THREE.Mesh(new THREE.BoxGeometry(t, data.h, data.d), mat).translateX(-data.w/2+t/2));
                mesh.add(new THREE.Mesh(new THREE.BoxGeometry(t, data.h, data.d), mat).translateX(data.w/2-t/2));
                mesh.add(new THREE.Mesh(new THREE.BoxGeometry(data.w, t, data.d), mat).translateY(data.h/2-t/2));
                mesh.add(new THREE.Mesh(new THREE.BoxGeometry(data.w, t, data.d), mat).translateY(-data.h/2+t/2));
                mesh.add(new THREE.Mesh(new THREE.BoxGeometry(data.w, data.h, t), mat).translateZ(-data.d/2+t/2));
                
                // 內部層板
                let currY = -data.h/2 + t;
                data.shelves.forEach(shelf => {
                    currY += parseFloat(shelf.h);
                    if(currY < data.h/2 - t) mesh.add(new THREE.Mesh(new THREE.BoxGeometry(data.w - t*2, t, data.d), mat).translateY(currY));
                });
                
                // 如果是在 ROOM 模式，要把這個櫃子裡的玩具也實體化包進 Group 裡
                if (!isExpandedCabinet && data.toys) {
                    data.toys.filter(t => !t.inBin).forEach(toy => {
                        const tMat = toy.img ? new THREE.MeshStandardMaterial({map: textureLoader.load(toy.img)}) : new THREE.MeshStandardMaterial({color: toy.color});
                        const tMesh = new THREE.Mesh(new THREE.BoxGeometry(toy.w, toy.h, toy.d), tMat);
                        // 玩具相對櫃體中心的座標
                        tMesh.position.set(toy.x, toy.y + toy.h/2, toy.z);
                        tMesh.castShadow = true;
                        mesh.add(tMesh);
                    });
                }
            } else if (data.type === 'sofa') {
                mesh = new THREE.Group();
                mesh.add(new THREE.Mesh(new THREE.BoxGeometry(data.w, data.h*0.4, data.d), mat).translateY(-data.h*0.3));
                mesh.add(new THREE.Mesh(new THREE.BoxGeometry(data.w, data.h, data.d*0.2), mat).translateZ(-data.d*0.4));
            } else if (data.type === 'bed') {
                mesh = new THREE.Group();
                mesh.add(new THREE.Mesh(new THREE.BoxGeometry(data.w, data.h*0.3, data.d), new THREE.MeshStandardMaterial({color: 0x8b5a2b})).translateY(-data.h*0.35));
                mesh.add(new THREE.Mesh(new THREE.BoxGeometry(data.w*0.95, data.h*0.4, data.d*0.95), mat));
            } else {
                mesh = new THREE.Mesh(new THREE.BoxGeometry(data.w, data.h, data.d), mat);
            }

            mesh.traverse(child => { if (child.isMesh) { child.castShadow = true; child.receiveShadow = true; } });
            
            // 處理座標系統 (ROOM 與 CABINET 的 Y/Z 軸意義不同)
            if (appMode === 'ROOM') {
                mesh.position.set(data.x, data.y + data.h/2, data.z);
                mesh.rotation.y = THREE.MathUtils.degToRad(data.rot);
            } else if (appMode === 'CABINET') {
                if (data.type === 'cabinet') {
                    // 櫃體框架在立面模式中置中且不可移動
                    mesh.position.set(0, data.h/2, 0); 
                } else if (data.type === 'toy') {
                    // 玩具在立面模式的座標
                    mesh.position.set(data.x, data.y + data.h/2, data.z);
                }
            }
            
            mesh.userData = { id: data.id };
            scene.add(mesh);
            
            // 在立面模式，不允許拖曳櫃體外框
            if (!(appMode === 'CABINET' && data.type === 'cabinet')) {
                draggableMeshes.push(mesh);
            }

            // --- 2. 建立 2D DOM ---
            const div = document.createElement('div');
            div.id = '2d_' + data.id;
            div.className = 'map-item';
            div.style.backgroundColor = data.img ? '#333' : data.color;
            if(data.img) { div.style.backgroundImage = `url(${data.img})`; }
            
            if (appMode === 'ROOM') {
                // 俯視平面圖 (X-Z)
                div.style.width = (data.w * SCALE_2D) + 'px';
                div.style.height = (data.d * SCALE_2D) + 'px';
                div.style.left = (data.x * SCALE_2D) + 'px';
                div.style.top = (data.z * SCALE_2D) + 'px';
                div.style.transform = `translate(-50%, -50%) rotate(${data.rot}deg)`;
                div.innerHTML = `<span style="background:rgba(0,0,0,0.6); padding:2px; border-radius:3px;">${data.name}</span>`;
            } else {
                // 立面圖 (X-Y) - 玩具
                if(data.type === 'toy') {
                    div.style.width = (data.w * SCALE_2D) + 'px';
                    div.style.height = (data.h * SCALE_2D) + 'px';
                    div.style.left = (data.x * SCALE_2D) + 'px';
                    div.style.top = (-data.y - data.h/2) * SCALE_2D + 'px'; // Y向上為負
                    div.innerText = data.name;
                    div.style.alignItems = 'flex-end'; div.style.paddingBottom = '2px';
                } else if (data.type === 'cabinet') {
                    // 立面圖 - 櫃體邊框 (不可拖曳)
                    div.style.width = (data.w * SCALE_2D) + 'px';
                    div.style.height = (data.h * SCALE_2D) + 'px';
                    div.style.left = '0px';
                    div.style.top = (-data.h/2) * SCALE_2D + 'px';
                    div.style.border = `4px solid ${data.color}`;
                    div.style.backgroundColor = 'transparent';
                    div.style.zIndex = '0';
                    div.style.pointerEvents = 'none'; // 讓滑鼠穿透外框抓取內部玩具
                    
                    // 繪製 2D 層板線
                    let currY = -data.h/2;
                    data.shelves.forEach(shelf => {
                        currY += parseFloat(shelf.h);
                        if(currY < data.h/2) {
                            const line = document.createElement('div');
                            line.style.position = 'absolute'; line.style.width = '100%'; line.style.height = '4px';
                            line.style.backgroundColor = data.color; line.style.bottom = (currY + data.h/2) * SCALE_2D + 'px';
                            div.appendChild(line);
                        }
                    });
                }
            }

            // 2D 拖曳邏輯 (僅針對可拖曳物件)
            if (!(appMode === 'CABINET' && data.type === 'cabinet')) {
                let isDragging = false, startX, startY, origLeft, origTop;
                
                div.addEventListener('pointerdown', (e) => {
                    isDragging = true; startX = e.clientX; startY = e.clientY;
                    origLeft = parseFloat(div.style.left); origTop = parseFloat(div.style.top);
                    orbitControls.enabled = false; div.setPointerCapture(e.pointerId); e.stopPropagation();
                });
                
                div.addEventListener('pointermove', (e) => {
                    if(!isDragging) return;
                    // 考量畫布縮放
                    const newX = (origLeft + (e.clientX - startX) / zoom2D) / SCALE_2D;
                    const newY_or_Z = (origTop + (e.clientY - startY) / zoom2D) / SCALE_2D;
                    
                    div.style.left = (newX * SCALE_2D) + 'px'; div.style.top = (newY_or_Z * SCALE_2D) + 'px';
                    mesh.position.x = newX;
                    
                    if (appMode === 'ROOM') mesh.position.z = newY_or_Z;
                    else mesh.position.y = -newY_or_Z; // Y修正
                });
                
                div.addEventListener('pointerup', (e) => {
                    isDragging = false; orbitControls.enabled = true;
                    if(appMode === 'ROOM') { data.x = mesh.position.x; data.z = mesh.position.z; } 
                    else { data.x = mesh.position.x; data.y = mesh.position.y - data.h/2; }
                    saveState();
                });
            }

            // 觸控雙擊支援
            let touchTimer = 0;
            div.addEventListener('pointerup', (e) => {
                const now = Date.now();
                if(now - touchTimer < 300) handleDoubleClick(data.id);
                else touchTimer = now;
            });

            fpContainer.appendChild(div);
        }

        function renderBinItem(toy) {
            const btn = document.createElement('div');
            btn.className = 'bg-gray-800 text-white text-xs p-2 rounded cursor-pointer border border-gray-600 hover:border-amber-500 truncate text-center';
            btn.innerText = toy.name;
            // 雙擊編輯或放回櫃子
            let touchTimer = 0;
            btn.addEventListener('pointerup', (e) => {
                const now = Date.now();
                if(now - touchTimer < 300) handleDoubleClick(toy.id);
                else touchTimer = now;
            });
            getEl('toy-bin').appendChild(btn);
        }

        // 同步 3D 到 2D
        function syncTo2D(id, x, val) {
            const div = getEl('2d_' + id);
            if(div) {
                div.style.left = (x * SCALE_2D) + 'px';
                if(appMode === 'ROOM') div.style.top = (val * SCALE_2D) + 'px'; // Z
                else div.style.top = (-val * SCALE_2D) + 'px'; // -Y
            }
        }

        // --- 4. 尋找物件與編輯面板 ---
        function findObjById(id) {
            // 先找主物件 (牆、櫃)
            let obj = roomData.objects.find(o => o.id === id);
            if (obj) return obj;
            // 如果沒找到，找櫃子裡的玩具
            for(let c of roomData.objects) {
                if(c.type === 'cabinet' && c.toys) {
                    obj = c.toys.find(t => t.id === id);
                    if (obj) return obj;
                }
            }
            return null;
        }

        function findCabinetByToyId(id) {
            return roomData.objects.find(c => c.type === 'cabinet' && c.toys && c.toys.some(t => t.id === id));
        }

        function handleDoubleClick(id) {
            const obj = findObjById(id);
            if(!obj) return;
            
            // 如果在 ROOM 模式下雙擊系統櫃，且不是要換皮，我們讓它「進入小宇宙」
            if (appMode === 'ROOM' && obj.type === 'cabinet') {
                enterCabinetMode(obj.id);
                return;
            }

            // 開啟通用編輯面板
            activeEditId = id;
            getEl('edit-title').innerHTML = `⚙️ 編輯 [${obj.name}]`;
            ['name','w','h','d','x','rot'].forEach(k => { if(getEl(`edit-${k}`)) getEl(`edit-${k}`).value = obj[k] !== undefined ? obj[k] : 0; });
            
            // 處理 Y / Z 顯示差異
            if(appMode === 'ROOM') {
                getEl('label-y-z').innerText = '前後座標 (Z)';
                getEl('edit-yz').value = obj.z || 0;
                getEl('edit-rot').parentElement.classList.remove('hidden');
            } else {
                getEl('label-y-z').innerText = '離地高度 (Y)';
                getEl('edit-yz').value = obj.y || 0;
                getEl('edit-rot').parentElement.classList.add('hidden'); // 立面玩具不給旋轉
            }
            
            // 層板 UI (僅在 CABINET 模式編輯櫃體時出現)
            const shelfManager = getEl('cabinet-shelves-manager');
            const list = getEl('shelves-list');
            list.innerHTML = '';
            
            if (appMode === 'CABINET' && obj.type === 'cabinet') {
                shelfManager.classList.remove('hidden');
                obj.shelves.forEach((s, idx) => {
                    list.innerHTML += `<div class="flex items-center gap-2 mb-1"><span class="text-white text-[10px] w-10">第${idx+1}層</span><input type="number" value="${s.h}" class="flex-1 bg-black text-white border border-gray-600 rounded px-1 py-1 text-xs" onchange="updateShelf(${idx}, this.value)"><button onclick="removeShelf(${idx})" class="text-red-500 text-xs px-2 py-1 bg-gray-900 rounded border border-red-900">刪</button></div>`;
                });
                getEl('btn-delete-obj').innerText = '✖ 刪除整個櫃體';
            } else { 
                shelfManager.classList.add('hidden'); 
                getEl('btn-delete-obj').innerText = obj.type === 'toy' ? (obj.inBin ? '✖ 徹底銷毀' : '📥 退回暫存區') : '✖ 刪除物件';
            }
            
            openModal('edit-modal');
        }

        // 層板微調函式
        function updateShelf(idx, val) { const obj = findObjById(activeEditId); if(obj) obj.shelves[idx].h = parseFloat(val); }
        function addShelfToCabinet() { const obj = findObjById(activeEditId); if(obj) obj.shelves.push({h: 30}); handleDoubleClick(activeEditId); }
        function removeShelf(idx) { const obj = findObjById(activeEditId); if(obj) obj.shelves.splice(idx, 1); handleDoubleClick(activeEditId); }

        function saveObjectEdit() {
            if(!activeEditId) return;
            const obj = findObjById(activeEditId);
            
            obj.name = getEl('edit-name').value || '物件';
            ['w','h','d','x'].forEach(k => obj[k] = parseFloat(getEl(`edit-${k}`).value) || 0);
            
            if(appMode === 'ROOM') {
                obj.z = parseFloat(getEl('edit-yz').value) || 0;
                obj.rot = parseFloat(getEl('edit-rot').value) || 0;
            } else {
                obj.y = parseFloat(getEl('edit-yz').value) || 0;
            }
            
            // 如果是玩具，儲存等於把它放進去
            if(obj.type === 'toy') obj.inBin = false;
            
            saveState(); forceRebuildAll(); closeModal('edit-modal');
        }

        function deleteObject() {
            if(!activeEditId) return;
            const obj = findObjById(activeEditId);
            
            if (obj.type === 'toy') {
                if (obj.inBin) {
                    // 徹底刪除
                    if(confirm('確定徹底銷毀此公仔？')) {
                        const cab = findCabinetByToyId(activeEditId);
                        if(cab) cab.toys = cab.toys.filter(t => t.id !== activeEditId);
                    }
                } else {
                    // 退回暫存區
                    obj.inBin = true;
                    obj.x = 0; obj.y = 0;
                }
            } else {
                // 刪除裝潢物件或櫃體
                if(confirm(`確定刪除 [${obj.name}] 嗎？`)) {
                    roomData.objects = roomData.objects.filter(o => o.id !== activeEditId);
                    if(appMode === 'CABINET' && obj.id === editingCabinetId) exitCabinetMode(); // 刪除正在編輯的櫃子則強制退出
                }
            }
            
            saveState(); forceRebuildAll(); closeModal('edit-modal');
        }
        
        function moveToyToBin(cabinet, toyId) {
            const toy = cabinet.toys.find(t => t.id === toyId);
            if(toy) toy.inBin = true;
        }

        getEl('image-uploader').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file || !activeEditId) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                const obj = findObjById(activeEditId);
                obj.img = event.target.result;
                saveState(); forceRebuildAll(); closeModal('edit-modal');
            };
            reader.readAsDataURL(file); e.target.value = '';
        });

            getEl('saved-state').textContent = JSON.stringify(roomData);
            const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
            const blob = new Blob([htmlContent], { type: 'text/html' });
            const a = document.createElement('a'); 
            a.href = URL.createObjectURL(blob); 
            a.download = 'My_Room_Planner.html'; 
            a.click();
        }

        // --- 啟動與復原機制 ---
        window.onload = () => {
            init3D();
            
            // 嘗試載入存檔
            try {
                const saved = JSON.parse(getEl('saved-state').textContent);
                if (saved && saved.objects) { roomData = saved; }
            } catch(e) {}
            
            if(roomData.objects.length === 0) {
                addRoomObj('floor'); 
                addRoomObj('wall'); roomData.objects[1].z = -150;
            } else {
                saveState(); forceRebuildAll();
            }
        };

        window.addEventListener('resize', () => {
            if(camera && renderer) {
                const container = getEl('view-3d');
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            }
        });
    </script>
