<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>系統櫃 1:1 高擬真驗證與 3D 拖曳沙盤</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        :root { --scale: 4px; /* 1cm = 4px (2D顯示比例) */ }
        
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Inter', 'Microsoft JhengHei', sans-serif;
            margin: 0;
            overscroll-behavior: none;
            touch-action: none; /* 防止手機瀏覽器預設滑動干擾拖曳 */
        }

        /* 隱藏捲軸但保留滾動功能 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #777; }

        .shelf-bg {
            background-image: 
                linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 20px 20px; 
            background-position: bottom left;
            transition: background-color 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-wrap: wrap; 
            align-items: flex-end; /* 地球引力向下對齊 */
            align-content: flex-end;
            cursor: pointer;
            box-sizing: border-box;
        }

        .shelf-bg.drag-over, .staging-bg.drag-over {
            background-color: rgba(245, 158, 11, 0.2);
            box-shadow: inset 0 0 20px rgba(245, 158, 11, 0.6);
        }

        .resize-handle {
            position: absolute;
            top: -5px;
            left: 0;
            width: 100%;
            height: 10px;
            cursor: ns-resize;
            z-index: 30;
            transition: background-color 0.2s;
        }
        .resize-handle:hover { background-color: rgba(245, 158, 11, 0.4); }

        .toy-block {
            transition: transform 0.1s ease-in-out, filter 0.2s;
            cursor: grab;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5);
            flex-shrink: 0; 
            touch-action: none; 
            position: relative;
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
        }
        
        @media (hover: hover) {
            .toy-block:hover {
                filter: brightness(1.1);
                transform: translateY(-2px);
                box-shadow: 0 4px 12px rgba(255,255,255,0.2), inset 0 0 0 1px rgba(255,255,255,0.5);
                z-index: 10;
            }
        }
        .toy-block:active { cursor: grabbing; }
        .toy-block.dragging {
            opacity: 0.5;
            transform: scale(0.95);
            box-shadow: 0 0 15px rgba(255,255,255,0.8);
            z-index: 50;
        }

        /* 3D 畫布容器 */
        #three-container {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #000;
            z-index: 9999;
            display: none;
        }
        #three-close-btn {
            position: absolute;
            top: 20px; right: 20px;
            z-index: 10000;
        }
        #three-ui-overlay {
            position: absolute;
            bottom: 20px; left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 20px;
            color: #aaa;
            font-size: 12px;
            pointer-events: none;
            z-index: 10000;
        }
    </style>
</head>
<body class="flex flex-col md:flex-row h-[100dvh] w-full overflow-hidden">

    <!-- 隱藏資源 -->
    <input type="file" id="image-uploader" accept="image/*" class="hidden">

    <div class="w-full md:w-80 lg:w-96 flex flex-col h-[40vh] md:h-full flex-shrink-0 z-20 shadow-[0_5px_15px_rgba(0,0,0,0.5)] md:shadow-[5px_0_15px_rgba(0,0,0,0.5)] bg-[#1e1814] border-b-4 md:border-b-0 md:border-r-4 border-[#3d2b1f]">
        <div class="p-3 md:p-5 border-b border-[#3d2b1f] bg-[#16120f] flex-shrink-0">
            <h1 class="text-base md:text-xl font-bold text-amber-500 mb-2 tracking-wide leading-snug">系統櫃立面配置<br><span class="text-white text-sm md:text-lg">1:1 絕對比例 3D 沙盤</span></h1>
            <p class="hidden md:block text-gray-400 text-xs mb-3 leading-relaxed">
                <strong class="text-amber-400">雙擊 (連點兩下)</strong> 玩具、層板或<strong class="text-amber-400">櫃體標題</strong>，可開啟設定選單。<br>
                拖曳層板頂部可微調高度，手指長按玩具即可拖移。

            <div class="grid grid-cols-2 gap-2 md:gap-3 mb-2">
                <button onclick="openModal('add-toy-modal')" class="py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded shadow-lg transition-colors">➕ 新增玩具</button>
                <button onclick="openModal('export-modal')" class="py-1.5 bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs rounded shadow-lg transition-colors">💾 匯出存檔</button>
            </div>
            <!-- 3D 轉換按鈕 -->
            <button onclick="generate3DScene()" class="w-full py-2 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold text-sm md:text-base rounded-lg shadow-[0_0_15px_rgba(124,58,237,0.5)] transition-all flex items-center justify-center gap-2 border border-purple-400/50">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10l-2 1m0 0l-2-1m2 1v2.5M20 7l-2 1m2-1l-2-1m2 1v2.5M14 4l-2-1-2 1M4 7l2-1M4 7l2 1M4 7v2.5M12 21l-2-1m2 1l2-1m-2 1v-2.5M6 18l-2-1v-2.5M18 18l2-1v-2.5"></path></svg>
                一鍵轉換 3D 實境

        </div>
        <div class="flex-1 p-3 md:p-4 overflow-y-auto flex flex-col min-h-0" id="scroll-area">

                📥 暫存庫存區 <span class="text-[10px] text-gray-500">(無尺寸限制)</span>

    </div>

    <script>
        const SCALE = 4;
        let draggedItem = null, touchGhost = null, touchOffsetX = 0, touchOffsetY = 0, activeDropzone = null;
        let activeObj = null, uploadType = ''; // 'toy' or 'shelf'
        let activeCabinet = null;

        // 工具函數：Modal 開關
        window.openModal = (id) => { document.getElementById(id).classList.remove('hidden'); document.getElementById(id).classList.add('flex'); };
        window.closeModal = (id) => { document.getElementById(id).classList.add('hidden'); document.getElementById(id).classList.remove('flex'); };
        window.showErrorModal = (msg) => { document.getElementById('error-message').innerHTML = msg; openModal('error-modal'); };

        // 綁定所有 2D 互動事件 (拖曳、雙擊)
        window.rebindAllEvents = function() {
            // 玩具事件綁定
            document.querySelectorAll('.toy-block').forEach(block => {
                if (block.dataset.bound === 'true') return;
                block.dataset.bound = 'true';
                
                // 雙擊開啟玩具設定
                block.addEventListener('dblclick', (e) => { e.preventDefault(); e.stopPropagation(); openToyOptions(block); });
                
                // Desktop 拖曳
                block.addEventListener('dragstart', () => { draggedItem = block; setTimeout(() => block.classList.add('dragging'), 0); });
                block.addEventListener('dragend', () => { block.classList.remove('dragging'); draggedItem = null; document.querySelectorAll('.dropzone').forEach(dz => dz.classList.remove('drag-over')); });

                // Touch 拖曳
                block.addEventListener('touchstart', (e) => {
                    if(e.touches.length > 1) return;
                    draggedItem = block;
                    const touch = e.touches[0];
                    const rect = block.getBoundingClientRect();
                    touchGhost = block.cloneNode(true);
                    touchGhost.style.position = 'fixed';
                    touchGhost.style.left = rect.left + 'px';
                    touchGhost.style.top = rect.top + 'px';
                    touchGhost.style.opacity = '0.7';
                    touchGhost.style.pointerEvents = 'none';
                    touchGhost.style.zIndex = '99999';
                    document.body.appendChild(touchGhost);
                    block.classList.add('dragging');
                    touchOffsetX = touch.clientX - rect.left;
                    touchOffsetY = touch.clientY - rect.top;
                }, {passive: true});

                block.addEventListener('touchmove', (e) => {
                    if (!touchGhost) return;
                    e.preventDefault(); 
                    const touch = e.touches[0];
                    touchGhost.style.left = (touch.clientX - touchOffsetX) + 'px';
                    touchGhost.style.top = (touch.clientY - touchOffsetY) + 'px';
                    touchGhost.style.visibility = 'hidden';
                    const target = document.elementFromPoint(touch.clientX, touch.clientY);
                    touchGhost.style.visibility = 'visible';
                    const dropzone = target ? target.closest('.dropzone') : null;
                    document.querySelectorAll('.dropzone').forEach(dz => dz.classList.remove('drag-over'));
                    activeDropzone = null;
                    if (dropzone) { dropzone.classList.add('drag-over'); activeDropzone = dropzone; }
                }, {passive: false});

                block.addEventListener('touchend', () => {
                    if (!touchGhost) return;
                    touchGhost.remove(); touchGhost = null;
                    block.classList.remove('dragging');
                    document.querySelectorAll('.dropzone').forEach(dz => dz.classList.remove('drag-over'));
                    if (activeDropzone && activeDropzone !== block.parentElement) handleDropLogic(block, activeDropzone);
                    draggedItem = null; activeDropzone = null;
                });
            });

            // 層板事件綁定
            document.querySelectorAll('.dropzone').forEach(dropzone => {
                if (dropzone.dataset.bound === 'true') return;
                dropzone.dataset.bound = 'true';
                
                dropzone.addEventListener('dblclick', (e) => {
                    if (e.target !== dropzone || dropzone.id === 'staging-area') return; 
                    e.preventDefault(); e.stopPropagation();
                    openShelfOptions(dropzone.closest('.shelf-container'));
                });

                dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('drag-over'); });
                dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag-over'));
                dropzone.addEventListener('drop', (e) => {
                    e.preventDefault(); dropzone.classList.remove('drag-over');
                    if (draggedItem && dropzone !== draggedItem.parentElement) handleDropLogic(draggedItem, dropzone);
                });
            });

            // 櫃體標題事件綁定 (開啟 3D 設定)
            document.querySelectorAll('.cabinet-header').forEach(header => {
                if (header.dataset.bound === 'true') return;
                header.dataset.bound = 'true';
                header.addEventListener('dblclick', (e) => {
                    e.preventDefault(); e.stopPropagation();
                    openCabinetOptions(header.closest('.cabinet-group'));
                });
            });
        }

        // 空間驗證邏輯 (包含深度)
        window.handleDropLogic = function(item, dropzone) {
            const maxW = parseFloat(dropzone.getAttribute('data-max-w')) || 9999;
            const maxH = parseFloat(dropzone.getAttribute('data-max-h')) || 9999;
            const maxD = parseFloat(dropzone.getAttribute('data-max-d')) || 9999;
            const zoneName = dropzone.getAttribute('data-name') || '此區塊';
            const itemW = parseFloat(item.getAttribute('data-w'));
            const itemH = parseFloat(item.getAttribute('data-h'));
            const itemD = parseFloat(item.getAttribute('data-d')) || itemW; // 若無深度預設同寬度
            const itemName = item.getAttribute('data-name');

            if (itemH > maxH) return showErrorModal(`【高度不足】<br>「${itemName}」高度為 <b>${itemH}</b> cm<br>「${zoneName}」淨高限制為 <b>${maxH}</b> cm<br><br>高度超出 <span class="text-red-400 font-bold">${(itemH - maxH).toFixed(1)}</span> cm`);
            if (itemD > maxD) return showErrorModal(`【深度不足】<br>「${itemName}」深度為 <b>${itemD}</b> cm<br>「${zoneName}」深度限制為 <b>${maxD}</b> cm<br><br>深度超出 <span class="text-red-400 font-bold">${(itemD - maxD).toFixed(1)}</span> cm`);

            const currentItems = Array.from(dropzone.querySelectorAll('.toy-block'));
            const currentUsedW = currentItems.reduce((sum, curr) => sum + parseFloat(curr.getAttribute('data-w')), 0);
            if (itemW > (maxW - currentUsedW)) return showErrorModal(`【面寬不足】<br>「${itemName}」需面寬 <b>${itemW}</b> cm<br>剩餘面寬僅 <b>${(maxW - currentUsedW).toFixed(1)}</b> cm`);
            
            dropzone.appendChild(item);
        }

        // --- 圖片上傳 (保留 Base64 資料供 3D 使用) ---

        // --- 拖曳改變層板高度 ---
        let isResizing = false, resizeTarget = null, startY = 0, startHeight = 0;
        window.startResizeShelf = function(e, handle) {
            e.preventDefault(); e.stopPropagation();
            isResizing = true; resizeTarget = handle.closest('.shelf-container');
            startY = e.clientY || (e.touches && e.touches[0].clientY);
            startHeight = parseFloat(resizeTarget.style.height);

            document.addEventListener('touchmove', doResize, {passive: false}); document.addEventListener('touchend', stopResize);
        }
        function doResize(e) {
            if (!isResizing) return;
            e.preventDefault();
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            let newHeightPx = startHeight + (startY - clientY);
            const dropzone = resizeTarget.querySelector('.dropzone');
            let maxToyH = 10; 
            dropzone.querySelectorAll('.toy-block').forEach(t => maxToyH = Math.max(maxToyH, parseFloat(t.getAttribute('data-h'))));
            if (newHeightPx < maxToyH * SCALE) newHeightPx = maxToyH * SCALE; 
            resizeTarget.style.height = newHeightPx + 'px';
            const newHeightCm = Math.round(newHeightPx / SCALE);
            dropzone.setAttribute('data-max-h', newHeightCm);
            resizeTarget.querySelector('.shelf-label').innerText = `${dropzone.getAttribute('data-name')} (高${newHeightCm})`;
        }
        function stopResize() {
            isResizing = false; resizeTarget = null;
            document.removeEventListener('mousemove', doResize); document.removeEventListener('mouseup', stopResize);
            document.removeEventListener('touchmove', doResize); document.removeEventListener('touchend', stopResize);

                    <div class="cabinet-header w-full bg-[#3d2b1f] text-amber-500 font-bold text-xs md:text-sm text-center py-2 border-b-4 border-[#2a1d15] relative z-20 cursor-pointer hover:bg-[#4d3b2f] transition-colors" title="雙擊設定 3D 空間">

        window.createNewShelf = function() {
            const cab = document.getElementById(document.getElementById('target-cabinet-id').value);
            const name = document.getElementById('new-shelf-name').value || '新層板';
            const h = parseFloat(document.getElementById('new-shelf-h').value) || 35;
            const match = cab.querySelector('.cabinet-title-text').nextSibling.nodeValue.match(/寬\s*([\d.]+)/);
            const w = match ? parseFloat(match[1]) : 70;
            const d = parseFloat(cab.getAttribute('data-d')) || 24;
            const shelfHtml = `
                <div class="shelf-container relative group border-b-[8px] border-[#8b5a2b]" style="height: ${h * SCALE}px; width: ${w * SCALE}px;">
                    <div class="resize-handle" onmousedown="startResizeShelf(event, this)" ontouchstart="startResizeShelf(event, this)"></div>
                    <div class="shelf-label absolute -top-[18px] left-1 text-[10px] text-amber-500/70 font-bold z-10 pointer-events-none">${name} (高${h})</div>
                    <div class="dropzone shelf-bg w-full h-full" data-name="${name}" data-max-w="${w}" data-max-h="${h}" data-max-d="${d}"></div>
                </div>`;

        window.createNewToy = function() {
            const name = document.getElementById('new-toy-name').value || '未命名';
            const w = parseFloat(document.getElementById('new-toy-w').value) || 10;
            const h = parseFloat(document.getElementById('new-toy-h').value) || 20;
            const d = parseFloat(document.getElementById('new-toy-d').value) || 10;
            const color = document.getElementById('new-toy-color').value;
            const toy = document.createElement('div');
            toy.className = 'toy-block rounded-sm flex items-center justify-center font-bold text-black text-[10px] overflow-hidden shadow-md text-center select-none';
            toy.style.width = (w * SCALE) + 'px'; toy.style.height = (h * SCALE) + 'px'; toy.style.backgroundColor = color;
            toy.setAttribute('draggable', 'true'); toy.setAttribute('data-name', name);
            toy.setAttribute('data-w', w); toy.setAttribute('data-h', h); toy.setAttribute('data-d', d); toy.setAttribute('data-color', color);
            toy.innerHTML = `<span class="text-content truncate px-1 pointer-events-none">${name}</span>`;
            document.getElementById('staging-area').appendChild(toy);

        window.exportAsFile = function() {
            const scriptNode = document.getElementById('init-toys'); if(scriptNode) scriptNode.remove();
            const blob = new Blob([document.documentElement.outerHTML], { type: 'text/html' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'cabinet_3d_design.html'; a.click();
        };

        let scene, camera, renderer, orbitControls, reqAnimFrame;
        const CM_TO_3D = 1; // 1cm = 1 3D unit

        window.generate3DScene = function() {
            document.getElementById('three-container').style.display = 'block';
            if(scene) { // 清理舊場景
                cancelAnimationFrame(reqAnimFrame);
                renderer.dispose();
                document.getElementById('three-container').removeChild(renderer.domElement);
            }

            // 初始化 Three.js
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);
            
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.set(0, 150, 400);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('three-container').appendChild(renderer.domElement);

            orbitControls = new THREE.OrbitControls(camera, renderer.domElement);
            orbitControls.target.set(0, 100, 0);

            // 燈光
            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
            dirLight.position.set(200, 300, 200);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // 地板
            const grid = new THREE.GridHelper(1000, 50, 0x555555, 0x333333);
            scene.add(grid);

            // 解析 2D DOM 建立 3D 模型
            const textureLoader = new THREE.TextureLoader();
            const matWood = new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 0.8 });
            const matShelf = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.9 });
            
            let defaultPosX = -100; // 自動排版 X 軸起點

            document.querySelectorAll('.cabinet-group').forEach((cabEl, cabIndex) => {
                const titleStr = cabEl.querySelector('.cabinet-title-text').nextSibling.nodeValue;
                const w = parseFloat(titleStr.match(/寬\s*([\d.]+)/)[1]) || 70;
                const d = parseFloat(cabEl.getAttribute('data-d')) || 24;
                const woodThick = 2; // 木板厚度 2cm

                // 計算櫃體總高
                let totalH = 0;
                cabEl.querySelectorAll('.shelf-container').forEach(sh => {
                    totalH += (parseFloat(sh.style.height) / SCALE) + woodThick;
                });

                const cabGroup = new THREE.Group();

                // 建立櫃體框架 (左、右、頂)
                const geoSide = new THREE.BoxGeometry(woodThick, totalH, d);
                const meshL = new THREE.Mesh(geoSide, matWood); meshL.position.set(-w/2 - woodThick/2, totalH/2, 0); meshL.castShadow = true;
                const meshR = new THREE.Mesh(geoSide, matWood); meshR.position.set(w/2 + woodThick/2, totalH/2, 0); meshR.castShadow = true;
                const geoTop = new THREE.BoxGeometry(w + woodThick*2, woodThick, d);
                const meshT = new THREE.Mesh(geoTop, matWood); meshT.position.set(0, totalH + woodThick/2, 0); meshT.castShadow = true;
                const meshB = new THREE.Mesh(geoTop, matWood); meshB.position.set(0, woodThick/2, 0); meshB.castShadow = true;
                cabGroup.add(meshL, meshR, meshT, meshB);

                // 處理層板與玩具
                let currentY = woodThick; // 從底板上方開始
                // 注意：在 DOM 中 .shelf-list 的順序是從上到下 (因為 prepend)，我們需要反轉來從底往上建
                const shelves = Array.from(cabEl.querySelectorAll('.shelf-container')).reverse();

                shelves.forEach(shelfEl => {
                    const shelfH = parseFloat(shelfEl.style.height) / SCALE;
                    const dropzone = shelfEl.querySelector('.dropzone');
                    const bgImg = dropzone.getAttribute('data-img');
                    
                    // 層板底板
                    const sMat = bgImg ? new THREE.MeshStandardMaterial({ map: textureLoader.load(bgImg) }) : matShelf;
                    const meshS = new THREE.Mesh(new THREE.BoxGeometry(w, woodThick, d), sMat);
                    meshS.position.set(0, currentY + woodThick/2, 0); meshS.receiveShadow = true;
                    cabGroup.add(meshS);
                    
                    currentY += woodThick; // 玩具的立足點Y

                    // 玩具 Packing (由左後方開始排列)
                    let tX = -w/2; 
                    let tZ = -d/2; 
                    let rowMaxD = 0;

                    dropzone.querySelectorAll('.toy-block').forEach(toyEl => {
                        const tw = parseFloat(toyEl.getAttribute('data-w'));
                        const th = parseFloat(toyEl.getAttribute('data-h'));
                        const td = parseFloat(toyEl.getAttribute('data-d')) || tw;
                        const tColor = toyEl.getAttribute('data-color') || '#ffffff';
                        const tImg = toyEl.getAttribute('data-img');

                        // 簡易折行邏輯 (如果超出版寬，往Z軸前方換行)
                        if (tX + tw > w/2) {
                            tX = -w/2;
                            tZ += rowMaxD + 1; // 1cm padding
                            rowMaxD = 0;
                        }

                        const tMat = tImg ? new THREE.MeshStandardMaterial({ map: textureLoader.load(tImg) }) : new THREE.MeshStandardMaterial({ color: new THREE.Color(tColor) });
                        const meshToy = new THREE.Mesh(new THREE.BoxGeometry(tw, th, td), tMat);
                        meshToy.position.set(tX + tw/2, currentY + th/2, tZ + td/2);
                        meshToy.castShadow = true;
                        cabGroup.add(meshToy);

                        tX += tw + 1; // 1cm padding X
                        rowMaxD = Math.max(rowMaxD, td);
                    });

                    currentY += shelfH;
                });

                // 設定櫃體 3D 空間絕對位置
                let definedX = cabEl.getAttribute('data-posx');
                let posX = definedX !== "" && definedX !== null ? parseFloat(definedX) : defaultPosX;
                let posZ = parseFloat(cabEl.getAttribute('data-posz')) || 0;
                let rotY = parseFloat(cabEl.getAttribute('data-roty')) || 0;

                cabGroup.position.set(posX, 0, posZ);
                cabGroup.rotation.y = THREE.MathUtils.degToRad(rotY);
                scene.add(cabGroup);

                if (definedX === "" || definedX === null) defaultPosX += w + woodThick*2 + 5; // 自動並排間距 5cm
            });

            // 動畫迴圈
            function animate() {
                reqAnimFrame = requestAnimationFrame(animate);
                orbitControls.update();
                renderer.render(scene, camera);
            }
            animate();
        };

        window.close3DScene = function() {
            document.getElementById('three-container').style.display = 'none';
            if(reqAnimFrame) cancelAnimationFrame(reqAnimFrame);
        };

        window.addEventListener('resize', () => {
            if(camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
    </script>

    <script id="init-toys">
        (function() {
            const canvas = document.getElementById('cabinet-canvas');
            const btnContainer = canvas.querySelector('.pb-4.shrink-0');

            function buildCabinet(id, title, w, d) {
                const cabHtml = `
                    <div class="cabinet-group flex flex-col bg-[#2a2a2a] border-x-[10px] border-[#5c4033] h-full shrink-0 relative group" id="${id}" data-d="${d}" data-posx="" data-posz="0" data-roty="0">
                        <div class="cabinet-header w-full bg-[#3d2b1f] text-amber-500 font-bold text-xs md:text-sm text-center py-2 border-b-4 border-[#2a1d15] relative z-20 cursor-pointer hover:bg-[#4d3b2f]" title="雙擊設定 3D 空間">
                            <span class="cabinet-title-text">${title}</span> (寬 ${w} / 深 ${d})
                            <button onclick="openAddShelf('${id}'); event.stopPropagation();" class="absolute left-2 top-2 text-emerald-400 hover:text-emerald-300 text-xs">+ 層板</button>

            function buildShelf(cabEl, name, w, h, d) {
                const shelfHtml = `
                    <div class="shelf-container relative group border-b-[8px] border-[#8b5a2b]" style="height: ${h * SCALE}px; width: ${w * SCALE}px;">
                        <div class="resize-handle" onmousedown="startResizeShelf(event, this)" ontouchstart="startResizeShelf(event, this)"></div>
                        <div class="shelf-label absolute -top-[18px] left-1 text-[10px] text-amber-500/70 font-bold z-10 pointer-events-none">${name} (高${h})</div>
                        <div class="dropzone shelf-bg w-full h-full" data-name="${name}" data-max-w="${w}" data-max-h="${h}" data-max-d="${d}"></div>
                    </div>`;
                const wrapper = document.createElement('div'); wrapper.innerHTML = shelfHtml.trim();
                cabEl.querySelector('.shelf-list').prepend(wrapper.firstChild); 
                return cabEl.querySelector('.shelf-container:first-child .dropzone');
            }
